header{background:radial-gradient(120% 160% at 100% 0%,#0d4a96 0%,#06214a 45%,#020d1f 100%);color:#fff;padding:16px 16px 12px;border-bottom:3px solid var(--gold)}

.BL{background:var(--bl)}.HR{background:var(--hr)}.PEM{background:var(--pem)}.TIM{background:var(--tim)}.PERS{background:var(--pers)}

textarea{width:100%;min-height:60px}

nav button.out{color:var(--bad);margin-top:10px;border-top:1px solid var(--line)!important;border-radius:0}
.hb{font-size:20px!important;line-height:1;padding:4px 10px!important}

async function doLogin(){const nm=document.getElementById('ln').value,pw=document.getElementById('lp').value,er=document.getElementById('lerr');
 const p=PEOPLE.find(x=>x.k===normN(nm));if(!p){er.textContent='Nama tidak ada di daftar peserta. Periksa ejaan atau hubungi admin.';return}
 if(pw.length<4){er.textContent='Password minimal 4 karakter.';return}
 if(sUrl()){try{const r=await sGet('acct',{k:p.k});if(r.none){const salt=Math.random().toString(36).slice(2),h=await hash(pw,salt),c=await sPost('claim',{k:p.k,salt,h});if(!c.ok){er.textContent='Akun baru saja dibuat di perangkat lain. Coba masuk lagi.';return}S.users[p.k]={salt,h};toast('Password Anda tersimpan di Google Sheet.')}else if(r.salt)S.users[p.k]={salt:r.salt,h:r.h}}catch(e){}}
 const u=S.users[p.k];
 if(!u){const salt=Math.random().toString(36).slice(2);S.users[p.k]={salt,h:await hash(pw,salt)};toast('Password Anda tersimpan. Gunakan ini untuk masuk berikutnya.')}
 else if(await hash(pw,u.salt)!==u.h){er.textContent='Password salah.';return}
 S.cur=p.k;S.role=p.r;S.base=p.r;S.who=p.n;view='home';save();render()}
function setMode(m){S.role=m;view='home';save();render();toast('Mode '+RN[m])}
function logout(){S.cur='';S.role='';S.base='';S.who='';save();render()}
function forgot(){modal(`<h3 style="margin-top:0">Masukkan kode password</h3><div class="lbl">Minta kode password ke admin, lalu tempel di sini. Password di perangkat ini akan diganti sesuai kode itu, kemajuan yang sudah tersimpan tetap ada.</div><textarea id="fc" placeholder="PWD27:..." style="width:100%;margin-top:8px;min-height:70px"></textarea><div class="row" style="margin-top:12px"><span class="sp"></span><button class="b" onclick="closeM()">Batal</button><button class="b p" onclick="doForgot()">Terapkan</button></div>`)}
function doForgot(){try{const v=document.getElementById('fc').value.trim();if(v.indexOf('PWD27:')!==0)throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(6)))));if(!PEOPLE.find(x=>x.k===o.k)||!o.s||!o.h)throw 0;S.users[o.k]={salt:o.s,h:o.h};save();closeM();toast('Password diperbarui. Silakan masuk.')}catch(e){toast('Kode password tidak valid')}}
function pwM(){modal(`<h3 style="margin-top:0">Kelola password</h3><div class="lbl">Atur password PPL atau PML, lalu salin kodenya dan kirim ke petugas. Petugas menempelkan kode itu lewat “Masukkan kode password” di halaman masuk.</div><input type="text" id="pn" list="pl2" style="width:100%;margin-top:8px" placeholder="Nama PPL atau PML" autocomplete="off"><datalist id="pl2">${PEOPLE.filter(p=>p.r!=='ORG').map(p=>`<option value="${esc(p.n)}">`).join('')}</datalist><input type="text" id="pp" style="width:100%;margin-top:8px" placeholder="Password baru (min. 4 karakter)" autocomplete="off"><div id="pe" style="color:var(--bad);font-size:13px;min-height:18px;margin-top:6px"></div><textarea id="pc" readonly style="width:100%;min-height:60px;display:none"></textarea><div class="row" style="margin-top:8px"><button class="b" onclick="closeM()">Tutup</button><span class="sp"></span><button class="b" onclick="pwDel()">Hapus password</button><button class="b p" onclick="pwSet()">Atur & buat kode</button></div>`)}
function pwFind(){const p=PEOPLE.find(x=>x.k===normN(document.getElementById('pn').value)&&x.r!=='ORG');if(!p)document.getElementById('pe').textContent='Nama PPL/PML tidak ditemukan.';return p}
async function pwSet(){const p=pwFind();if(!p)return;const pw=document.getElementById('pp').value;if(pw.length<4){document.getElementById('pe').textContent='Password minimal 4 karakter.';return}const salt=Math.random().toString(36).slice(2),h=await hash(pw,salt);S.users[p.k]={salt,h};save();let sv='';if(sUrl()){try{const r=await sPost('setpw',{t:sTok(),k:p.k,salt,h});sv=r.ok?' Tersimpan di Google Sheet.':' Google Sheet menolak (token?).'}catch(e){sv=' Gagal ke Google Sheet.'}}const c='PWD27:'+btoa(unescape(encodeURIComponent(JSON.stringify({k:p.k,s:salt,h}))));document.getElementById('pe').textContent='';const t=document.getElementById('pc');t.style.display='block';t.value=c;t.select();try{navigator.clipboard.writeText(c).catch(()=>{})}catch(e){}toast('Password diatur.'+sv+' Kode disalin.')}
async function pwDel(){const p=pwFind();if(!p)return;delete S.users[p.k];save();let sv='';if(sUrl()){try{const r=await sPost('setpw',{t:sTok(),k:p.k,del:1});sv=r.ok?' dan di Google Sheet':' (Google Sheet menolak, token?)'}catch(e){sv=' (gagal ke Google Sheet)'}}toast('Password '+p.n.split(' ')[0]+' dihapus di perangkat ini'+sv)}
function chPw(){modal(`<h3 style="margin-top:0">Ganti password</h3><input type="password" id="op" placeholder="Password lama" style="width:100%;margin-bottom:8px"><input type="password" id="np" placeholder="Password baru (min. 4 karakter)" style="width:100%"><div id="cerr" style="color:var(--bad);font-size:13px;min-height:18px;margin-top:6px"></div><div class="row"><span class="sp"></span><button class="b" onclick="closeM()">Batal</button><button class="b p" onclick="doCh()">Simpan</button></div>`)}
async function doCh(){const u=S.users[S.cur],o=document.getElementById('op').value,n=document.getElementById('np').value,er=document.getElementById('cerr');if(await hash(o,u.salt)!==u.h){er.textContent='Password lama salah';return}if(n.length<4){er.textContent='Minimal 4 karakter';return}const salt=Math.random().toString(36).slice(2);S.users[S.cur]={salt,h:await hash(n,salt)};save();closeM();toast('Password diganti')}
function forRole(e,r){if(r==='ORG')return true;if(e.type==='PERS')return e.title.startsWith('Pelatihan');return true}
const isPml=d=>/^-?\s*PML\b/.test(d);
function dets(e,r){r=r||S.role;if(e.type==='PERS')return e.det;if(e.type==='TIM')return[];if(r==='PML'||r==='ORG')return e.det.filter(isPml);return e.det.filter(d=>!isPml(d))}
function isDone(e){return !!S.done[K(e.id)]}
function prog(e){const n=dets(e).length;if(!n)return isDone(e)?1:0;const c=(S.chk[K(e.id)]||[]).filter(Boolean).length;return c/n}

const QNA=[{"q":"Terkait batasan definisi ARTE dan ARTL","a":"ARTE mencakup orang yang menetap dan makan/minum dari dapur yang sama serta tidak memiliki ikatan kerja atau hubungan bayar-membayar dengan rumah tangga. ARTL mencakup orang yang menetap dan makan/minum dari dapur yang sama, tetapi memiliki ikatan kerja atau hubungan bayar-membayar dengan rumah tangga. Hubungan kekerabatan dengan kepala rumah tangga bukan syarat mutlak untuk menjadi ARTE. Dengan demikian, pembeda utama ARTE dan ARTL adalah ada atau tidaknya ikatan kerja atau hubungan bayar-membayar.","p":"","s":"pen","t":["art"]},{"q":"Terkait konsep usaha yang dicakup dalam SPKRT","a":"Usaha anggota rumah tangga yang dicatat baik pada catatan pengeluaran maupun pendapatan adalah unit usaha yang dimiliki atau dikelola oleh kepala rumah tangga/anggota rumah tangga ekonomi dalam bentuk usaha yang tidak berbadan hukum (unincorporated), tidak mempunyai atau tidak dapat menyusun laporan keuangan yang lengkap, mulai dari aktivitas produksi sampai kepemilikan aset baik aset fisik maupun finansial. Dalam hal ini, pengeluaran dalam rangka usaha bisa jadi tercampur dengan pengeluaran rumah tangga.","p":"","s":"pen","t":["bl","s","art"]},{"q":"Terkait konsumsi yang dibiayai pemerintah","a":"Barang atau jasa yang dibiayai pemerintah sebagai konsumsi pemerintah tidak dicatat sebagai pengeluaran konsumsi rumah tangga dalam SPKRT. Klaim pelayanan BPJS, baik peserta PBI maupun non-PBI atau mandiri, tidak perlu diimputasi sebagai konsumsi rumah tangga. Namun, iuran BPJS yang dibayar peserta non-PBI atau mandiri dicatat sebagai pengeluaran bukan konsumsi pada dokumen BL. Apabila nantinya komoditas dan NK kelompok Kesehatan menjadi sedikit/kecil, menunjukkan bahwa banyak konsumsi rumah tangga pada kelompok ini yang pembiayaannya berasal dari pengeluaran pemerintah.","p":"","s":"pen","t":["bl","adm","art"]},{"q":"Terkait pencatatan konsumsi program Makan Bergizi Gratis (MBG)","a":"Makanan yang disalurkan melalui program Makan Bergizi Gratis tidak dicatat sebagai pengeluaran konsumsi rumah tangga karena dibiayai melalui anggaran pemerintah. Ketentuan ini berlaku baik bagi penerima manfaat program maupun untuk makanan program yang dibawa pulang atau dikonsumsi oleh pihak lain (misalnya petugas SPPG).","p":"","s":"pen","t":["bl","adm"]},{"q":"Terkait penyesuaian narasi cara perolehan (kode 4) dan pendapatan dari pemerintah","a":"Dengan adanya keputusan bahwa konsumsi yang dibiayai pemerintah tidak dicatat sebagai pengeluaran konsumsi rumah tangga, maka pada kode cara perolehan berkode 4 (Pemberian dari pihak lain) tidak lagi mencantumkan \"pemerintah\" sebagai contoh pihak pemberi. Penjelasan pada buku pedoman dan bahan ajar akan diperbaiki agar konsisten. untuk narasi pendapatan dari pemerintah pada subblok VIII.3 pada kuesioner S juga akan dihapuskan","p":"","s":"pen","t":["bl","s"]},{"q":"Terkait pembatalan transaksi dan pengembalian dana (refund)","a":"Apabila transaksi pembelian barang atau jasa dibatalkan dan dana dikembalikan, nilai transaksi yang dibatalkan tidak dicatat sebagai pengeluaran konsumsi. Jika terdapat bagian pembayaran yang tidak dikembalikan dan menjadi biaya pembatalan atau penalti, bagian tersebut dicatat sebagai denda dan sejenisnya, dengan kode 1211036001.","p":"","s":"pen","t":["bl","adm"]},{"q":"Terkait urgensi pencatatan pengeluaran bukan konsumsi dan pendapatan","a":"Pencatatan pengeluaran bukan konsumsi serta pendapatan tetap dilakukan sesuai rincian kuesioner. Informasi tersebut diperlukan sebagai kontrol dan pemeriksaan kewajaran serta konsistensi data pengeluaran rumah tangga.","p":"","s":"pen","t":["bl","s"]},{"q":"Terkait jadwal pencacahan selama Ramadhan dan Idulfitri","a":"Pencacahan mengikuti jadwal khusus yang telah ditetapkan dengan mempertimbangkan Ramadan dan Idulfitri. Jadwal HR disusun agar konsumsi selama ramadhan serta menjelang dan setelah hari raya tetap teramati. Pencacahan HR Minggu ke-1 : M4 Februari 2027 (22 Februari\n• 28 Februari) Pencacahan HR Minggu ke-2 : M3 Maret 2027 (15 Maret\n• 21 Maret) Pencacahan HR Minggu ke-3 : M4 Maret 2027 (22 Maret – 28 Maret) Pencacahan HR Minggu ke-4 : M5 Maret 2027 (29 Maret – 4 April) Wawancara dokumen S dilaksanakan sesuai jadwal yang ditentukan yaitu bersamaan dengan jadwal kunjungan pencacahan HR, dengan pemeriksaan silang terhadap dokumen BL yang telah tersedia . Untuk pencacahan kuesioner S minggu I bulan Maret 2027 yang dijadwalkan pada minggu IV Februari, tabel rekapitulasi untuk pemberian tanda cek pada kolom VI hanya dari hasil entri BL bulan Januari.","p":"","s":"pen","t":["bl","hr","s","jadwal"]},{"q":"Terkait jenis pasar untuk biaya administrasi bank","a":"Biaya administrasi bank dicatat dengan jenis pasar kode 3, yaitu outlet, bukan kode 5. Penggunaan aplikasi mobile banking sebagai sarana pemberitahuan atau pemeriksaan mutasi tidak mengubah jenis pasar sumber layanan perbankan. Ketentuan ini akan disesuaikan dalam buku pedoman dan bahan ajar.","p":"","s":"pen","t":["bl","app"]},{"q":"Terkait kode jenis pasar ketika responden tidak mengetahui tempat barang/jasa","a":"diperoleh Jika responden tidak mengetahui jenis pasar tempat barang/jasa diperoleh , maka diisikan kode 1 (Pasar Tradisional). Apabila suatu wilayah diketahui tidak memiliki pasar tradisional, jenis pasar dicatat kode 3 (outlet).","p":"","s":"pen","t":["bl"]},{"q":"Terkait diskon, promosi beli satu gratis satu (buy 1 get 1), dan hadiah","a":"Untuk barang yang dibeli dengan diskon, nilai pengeluaran dicatat sebesar harga yang benar-benar dibayar setelah diskon. Pada promosi beli satu gratis satu, seluruh barang dalam paket dinilai berdasarkan total pembayaran riil, tanpa menambahkan imputasi untuk barang gratis dalam paket tersebut. Adapun hadiah atau bonus yang diberikan secara terpisah dari paket pembelian tetap diperkirakan nilainya sebagai konsumsi sesuai ketentuan.","p":"","s":"pen","t":["bl","adm"]},{"q":"Terkait penggunaan cashback, poin, atau koin untuk berbelanja","a":"Berbeda dengan konsep diskon, penggunaan poin atau koin hasil cashback untuk memperoleh barang atau jasa tidak mengurangi pencatatan nilai barang atau jasa yang diperoleh. Pencatatan konsumsi barang/jasa utuh sesuai dengan harga/nilai asli barang/jasa tersebut. Nilai poin yang digunakan sebagai alat pembayaran perlu dicatat sebagai balancing pada bagian pendapatan di kuesioner S blok VIII.3.","p":"","s":"pen","t":["bl","s","adm"]},{"q":"Terkait top-up kartu permainan anak dan wahana rekreasi","a":"Top-up kartu atau koin permainan anak dan wahana rekreasi dicatat sebesar seluruh nilai top-up, meskipun saldo belum digunakan seluruhnya. Perlakuan ini berbeda dengan top-up uang elektronik atau dompet digital, yang baru dicatat sebagai pengeluaran konsumsi ketika saldo digunakan untuk memperoleh barang atau jasa, sesuai jenis konsumsi yang dilakukan.","p":"","s":"pen","t":["bl"]},{"q":"Terkait makanan siap olah yang disimpan sebelum dikonsumsi","a":"• Makanan siap olah atau makanan beku (frozen food) yang disimpan terlebih dahulu dicatat pada saat diolah atau disiapkan untuk dikonsumsi, bukan saat dibeli.\n• Bahan makanan yang digunakan kembali, seperti minyak goreng bekas yang masih dipakai, tidak dicatat sebagai konsumsi baru setiap kali digunakan ulang (hanya dicatat di awal).","p":"","s":"pen","t":["bl"]},{"q":"Terkait pembelian makanan dalam bentuk paket","a":"Apabila pembelian makanan dalam satu paket terdiri atas beberapa komoditas yang nilainya dapat dipisahkan, pencatatan dilakukan menurut masing-masing komoditas. Jika tidak memungkinkan, maka dicatat sebagai 1 komoditas","p":"","s":"pen","t":["bl"]},{"q":"Terkait minuman atau barang gratis dalam paket makanan","a":"Barang atau minuman yang merupakan bagian dari promosi paket pembelian perlu diimputasi sesuai nilai barang","p":"","s":"pen","t":[]},{"q":"Terkait pembelian melalui whatsapp atau media sosial","a":"Jenis pasar pembelian melalui WhatsApp, Instagram, Facebook, atau media sosial lainnya tidak termasuk dalam jenis pasa kode 5 (Marketplace/Website/Online Shop/Aplikasi Online Lainnya), karena hanya digunakan sebagai media komunikasi. Jenis pasar dimana pembelian melalui WA, IG, FB disesuaikan dengan jenis tempat usaha pedagang","p":"","s":"pen","t":["bl","app"]},{"q":"Terkait transaksi tukar tambah barang (trade in)","a":"Dalam transaksi tukar tambah, nilai pengeluaran konsumsi barang baru dicatat sebesar nilai penuh barang yang diperoleh, bukan hanya tambahan uang yang dibayarkan. Nilai barang lama yang diserahkan diperhitungkan pada bagian pendapatan atau penerimaan yang sesuai agar transaksi tercatat secara utuh dan seimbang.","p":"","s":"pen","t":["bl","s"]},{"q":"Terkait jenis pasar pembelian melalui jasa titip","a":"Pembelian barang melalui jasa titip diklasifikasikan berdasarkan jenis tempat usaha asal barang. Untuk barang yang diperoleh dari toko atau outlet khusus, jenis pasarnya dicatat sebagai outlet atau toko khusus, bukan berdasarkan keberadaan perantara jasa titip.","p":"","s":"pen","t":["bl"]},{"q":"Terkait biaya jasa perantara tidak resmi","a":"Biaya yang dikeluarkan rumah tangga untuk jasa perantara, termasuk jasa yang tidak resmi, tetap dicatat dalam SPKRT sesuai transaksi yang terjadi, namun tidak akan tercakup dalam komoditas di pencacahan SHK","p":"","s":"pen","t":["bl","art"]},{"q":"Terkait penggantian responden pada pencacahan HR","a":"Apabila terdapat rumah tangga pengganti, pencacahan HR dilakukan mulai minggu ketika rumah tangga tersebut ditetapkan sebagai sampel pengganti, tanpa perlu mengikuti jadwal pencacahan rumah tangga yang digantikan. Sebagai contoh, apabila rumah tangga pengganti mulai menjadi sampel pada minggu ketiga bulan Juni, maka pencacahan HR cukup dilakukan pada minggu ketiga atau keempat, meskipun rumah tangga yang digantikan sebelumnya seharusnya dicacah pada minggu pertama.","p":"","s":"pen","t":["sampel","hr","jadwal"]},{"q":"Terkait perolehan bahan makanan dari alam","a":"Bahan makanan yang diperoleh langsung dari alam, seperti hasil memetik tumbuhan liar atau berburu untuk dikonsumsi sendiri, dicatat dengan cara perolehan kode 2, yaitu lainnya. Jenis pasar yang digunakan adalah kode 1, yaitu pasar tradisional.","p":"","s":"pen","t":["bl"]},{"q":"Terkait cara perolehan air dengan pembayaran rutin","a":"Air yang disalurkan melalui pengelolaan bersama dan dibayar secara rutin dengan tarif tetap berdasarkan kesepakatan warga dikategorikan sebagai membeli. Maka cara perolehannya adalah melalui pembelian","p":"","s":"pen","t":["bl","adm"]},{"q":"Terkait batasan pasar modern dan minimarket","a":"Pengelompokan pasar modern dan minimarket mempertimbangkan karakteristik dan kelengkapan komoditas yang dijual. Apabila barang/jasa yang dijual bervariasi dan lengkap (termasuk sayur-sayuran segar, daging-dagingan, barang-barang industri, perlengkapan bayi, dll) maka bisa dikategorikan sebagai pasar modern.","p":"","s":"pen","t":["bl"]},{"q":"Terkait konsep perjalanan","a":"Konsep Perjalanan yang digunakan pada SPKRT 2027 sudah mengadopsi konsep internasional yang juga digunakan dalam pencacahan Wisatawan Nusantara, yaitu perjalanan yang dilakukan ke kabupaten/kota lain dengan lama berdiam di tempat tujuan paling sedikit 6 jam.","p":"","s":"pen","t":["art"]},{"q":"Terkait iuran kas sekolah","a":"Iuran yang dibayarkan rumah tangga untuk kas sekolah dicatat sebagai pengeluaran konsumsi pada kelompok pendidikan","p":"","s":"pen","t":["bl","adm"]},{"q":"Terkait jenis pasar koperasi desa","a":"Pembelian barang dari koperasi desa dicatat dengan jenis pasar outlet atau toko khusus","p":"","s":"pen","t":["bl"]},{"q":"Terkait pengeluaran selama perjalanan dinas","a":"Pengeluaran perjalanan dinas perlu dibedakan berdasarkan pihak yang menanggung pembiayaannya. Sesuai pembahasan, perjalanan dinas PNS tidak dimasukkan sebagai pengeluaran konsumsi rumah tangga, sedangkan pengeluaran perjalanan dinas pegawai BUMN atau swasta dicatat sebagai konsumsi dan harus diseimbangkan dengan pendapatan atau penerimaan terkait pada dokumen S Blok VIII","p":"","s":"pen","t":["bl","s"]},{"q":"Rumah tangga tidak eligible di bulan kedua atau ketiga","a":"Sampel rumahtangga yang menjadi tidak eligible di bulan kedua atau ketiga (misal di bulan kedua dan ketiga semua ART tidak bekerja/berusaha) maka sampel rumah tangga tersebut tetap dilakukan pencacahan sampai akhir triwulan.","p":"","s":"pen","t":["sampel","art"]},{"q":"1. Tadi disampaikan bahwa dalam jadwal terdapat pendataan harga komoditas tahun dasar 2027. Karena paket komoditas dan diagram timbang hasil SPKRT belum terbentuk, apa dasar penentuan komoditas yang akan dicacah harganya? Apakah daftarnya sama untuk seluruh daerah atau berdasarkan hasil asesmen masing-masing daerah?\n2. Jika hasil SPKRT nantinya menetapkan komoditas baru yang belum dicacah harganya selama 2027, bagaimana mekanisme memperoleh harga tahun dasarnya? Mohon gambaran umumnya.","a":"Pencacahan harga tahun dasar (2027) dilakukan untuk seluruh Kabupaten/Kota cakupan SPKRT 2027, baik kabkot lama maupun kabkot baru. \n\nKabkot lama (150 Kabkot 2022=100):\n- Pencacahan harga tahun dasar dilakukan untuk komoditas \"baru\" yang berpotensi masuk pada pakom kabkot tersebut. \n- Komoditas baru ini diperkirakan dari hasil diagram timbang sementara masing-masing daerah, sehingga daftar komoditasnya dapat berbeda antar daerah,\n- sedangkan pencacahan komoditas lama tetap dilakukan seperti biasa melalui survei harga konsumen.\n\nKabkot baru cakupan SPKRT 2027:\n- Pencacahan harga tahun dasar dilakukan untuk komoditas hasiL identifikasi yang dilakukan oleh 360 kabkot.\n\nPendataan harga komoditas di beberapa periode yang telah terlewat akan dilakukan secara recall.","p":"Penentuan komoditas dari Identifikasi awal terhadap 222 komoditas dari 847 paket komoditas nasional yang dipilih berdasarkan kemunculannya sebagai paket komoditas di sekurang-kurangnya 85% kota HK (2022=100), yang di paparkan pada saat acara Assesment Kesiapan Pendataan SHK di 360 Kab/Kota & Identifikasui 222 Komoditas.\n\nSetuju, mekanisme pencacahan komoditas yang terpilih dari hasil SPKRT dapat dilakukan dengan cara recall","s":"innas","t":["sampel","bl","jadwal","art"]},{"q":"Jika dilakukan penggantian sampel di tengah triwulan, bagaimana mengisikan pelaporan bagi sampel yang diganti dan pengganti?","a":"Apakah yang dimaksud adalah pelaporan di FASIH? Jika ya, pertanyaan diteruskan ke Tim SIS.","p":"akan ada sesi untuk penjelasan terkait pergantian sampel RT","s":"innas","t":["sampel","app"]},{"q":"1. Karena BL dan BLp diisi sendiri oleh responden, bagaimana cara menjelaskan konsep akuisisi dengan bahasa yang mudah dipahami, agar responden tidak hanya mencatat uang yang dibayarkan pada bulan tersebut? Misalnya, barang dibayar sebelum periode pencacahan tetapi baru diterima saat pencacahan, atau jasa dibayar sebelumnya tetapi digunakan saat pencacahan. Apakah ada contoh atau panduan?\n2. Tanggal pada blok II BL, apakah tanggal kunjungan pertama?","a":"1. Setelah menjelaskan, lalu diberikan contoh kasusnya. Mungkin bisa dengan menjelaskan bahwa yang dicatat di BL adalah barang/jasa yang dinikmati dan benar-benar dikuasai secara fisik pada periode referensi 3 bulan pendataan.\n2. Bukan, tanggal pada Blok II adalah tanggal penyerahan kuesioner yang telah terisi dari pencacah ke pengawas.","p":"setuju","s":"innas","t":["bl"]},{"q":"1. untuk konsumsi komoditas jasa yang tidak digunakan saat masa periode pencacahan apakah tetap dicatat di BL?\nMisal membeli tiket pesawat di triwulan pendataan, namun tidak digunakan sehingga tiketnya hangus dan tidak dilakukan refund\n\n2. kalau jadwal penerbangannya di tw pendataan tapi tidak jadi berangkat, apakah tetap dicatat (seperti contoh hotel)? atau ada batasan tertentu, misal udah check in online?","a":"/","p":"setuju","s":"innas","t":["bl","jadwal"]},{"q":"Tidak termasuk ART meskipun masih pulang secara berkala, misalnya seminggu sekali atau pada saat libur. Apakah seminggu merupakan batasan yang ditetapkan? Jika pulang 3 hari sekali apakah dicatat? Atau harus benar2 yg pulang setiap hari?\n\nApakah dicatat di BL blok IV.3?","a":"Seseorang yang merantau dengan tujuan bekerja atau kuliah (tidak memandang seberapa sering/seberapa jarang orang tsb pulang-pergi ke rumahnya), maka tidak dianggap sebagai ART dan tidak dicatat di Blok IV.\n\nYang dicatat dalam Blok IV.3 adalah orang-orang yang digaji oleh ruta namun tidak menginap di ruta tersebut.","p":"Setuju,\nPertanyaan di kelas B sdh diberi penjelasan","s":"innas","t":["bl","art"]},{"q":"1. Di contoh 1, ongkir yg gratis meskipun dinikmati ruta tidak dicatat, hanya sesuai yg dibayarkan. Kenapa di contoh 2 peniti gratis tetap dicatat (diimputasi) dgn alasan dinikmati ruta?\n2. Bagaimana pencatatan barang yg dibeli buy 1 get 1? Apakah harga barang gratisannya dicatat sesuai contoh 2? atau cukup dicatat nilai asli yg dbayarkan sesuai contoh 1?\n3. Barang2 bonus atas pembelian barang dicatat kode pemberian dari perusahaan?","a":"1. Pending. Ongkir yang gratis karena mendapat diskon butuh penegasan karena ongkir itu juga dinikmati oleh responden, sama seperti bonus peniti.\n2. Pending.\n3. Barang bonus yang diperoleh karena responden membeli suatu barang >> cara perolehannya adalah pembelian, bukan pemberian. Pemberian adalah memperoleh barang secara cuma-cuma tanpa harus membeli apapun terlebih dahulu.","p":"1. Untuk konsumsi berdasarkan harga riil yang dibayarkan, maka diskon ongkir tidak perlu di perkirakan sebagai pengeluaran\n2. Barang yang diperoleh secara gratis diperkirakan harganya sebagai pengeluaran","s":"innas","t":["bl"]},{"q":"1. Pemberian uang saku/uang jajan ke anak sekolah yg berusia < 13 tahun yg tdk masuk kriteria mendapat dokumen BLp (lalu dibelanjakan si anak di sekolah), dicatat sebagai pengeluaran jenis barang/jasa apa?\n2. Bagaimana pencatatan pengeluaran untuk bahan yang digunakan bersama untuk usaha dan konsumsi rumah tangga, apabila rumah tangga tidak dapat memisahkan nilainya? Misalnya, gas elpiji dan wajan digunakan untuk membuat gorengan yang dijual sekaligus untuk memasak kebutuhan sehari-hari. Apakah pengeluaran tersebut dicatat sebagai pengeluaran bukan konsumsi untuk usaha atau pengeluaran konsumsi rumah tangga?","a":"1. Bisa ditanyakan ke anak, apa saja yg dibeli dengan uang tsb\n2. Dapat diperkirakan yang digunakan untuk keperluan keluarga","p":"Setuju","s":"innas","t":["bl"]},{"q":"1. Jika rumah tangga membeli barang dan langsung diberikan kepada rumah tangga lain tanpa digunakan sendiri, apakah perolehannya tetap dicatat pada BL atau hanya pemberiannya sebagai bukan konsumsi?\n2. Untuk pengeluaran yg dibayarkan tahunan, contoh keanggotaan pilates/gym selama setahun yang dibayar sekaligus, apakah nilainya dicatat penuh (biaya 1 tahun) saat hak layanan diperoleh atau dialokasikan menurut bulan layanan (diisikan harga per bulan)?","a":"1. Tetap di catat di BL, sebagai pengeluaran non konsumsi (diberikan ke pihak lain).\n2. Tidak perlu disebulankan, dicatat sesuai biaya 1 tahun yang dibayar.","p":"Setuju","s":"innas","t":["bl"]},{"q":"Apabila di dalam rumah tangga ada asisten rumah tangga yang tidak menginap (bukan anggota rumah tangga), bagaimana cara memisahkan pengeluaran rumah tangga (Blok V kuesioner BL) yang digunakan bersama (misalnya listrik, air, bahan bakar rumah tangga, dan perlengkapan mandi)?","a":"Untuk barang-barang yang bisa diidentifikasi diberikan ke asisten ruta tsb, maka dicatat sebagai pemberian ke pihak lain. Namun jika memang sama sekali tidak bisa dipisahkan antara pemakaian ruta dan yang diberikan ke asisten ruta tsb, maka dianggap sebagai pemakaian ruta.","p":"Setuju","s":"innas","t":["sampel","bl","art"]},{"q":"Untuk pendapatan cashback yang tidak perlu dicatat di kusioner BL apakah nanti tetap dicatat sebagai pendapatan di kuesioner S?","a":"Tidak. Pertimbangannya adalah voucher itu tidak semuanya akan digunakan kembali, kecuali cashback berupa uang cash dan sifatnya voucher untuk pembelian atau transaksi selanjutnya, selain itu voucher ada jangka waktunya.\nLalu jika voucher tersebut akan digunakan dalam transaksi selanjutnya dan transaksi selanjutnya tsb masih dalam periode pencacahan, maka itu bisa dianggap sebagai diskon dari barang yang dibeli.","p":"","s":"innas","t":["bl","s"]},{"q":"Pembelian rumah untuk ditinggali (bukan untuk investasi) apakah termasuk konsumsi atau bukan konsumsi? Bagaimana kalo misalnya rumah tangga melakukan pembelian dengan indent (misal 1 tahun) kemudian serah terima kunci dilakukan pada waktu pencacahan? Pencatatannya seperti apa?","a":"Pembelian rumah adalah pengeluaran bukan konsumsi. Cek kode komoditas di Buku 5: 1211001","p":"Pembelian barang secara inden, berarti barang tersebut secara fisik unitnya belum tersedia walaupun transaksi penyerahan kunci dilakukan pada saat periode survei, tetapi fisiknya belum dikuasai >> maka tidak dicatat jika fisik unit diterima di luar periode survei.","s":"innas","t":["bl"]},{"q":"Untuk pembelian barang secara kredit, misalkan membeli motor dengan harga 20 juta, dicicil selama 5 tahun. Total harga setelah ditambah bunga adalah 25 juta. Untuk yang dimasukkan dalam pengeluaran konsumsi apakah nilai sebelum bunga atau setelah ditambah bunga kredit? atau hanya uang muka saja yang dimasukkan dalam pengeluaran konsumsi?","a":"- Harga motor yg dimasukan sebagai konsumsi adalah harga jika dibeli tunai = Rp20 Juta\n- Uang Muka yg dibayarkan di bulan tsb sebagai pengeluaran non konsumsi\n- Cicilan yang dibayarkan di bulan berikutnya sebagai pengeluaran non konsumsl","p":"Setuju","s":"innas","t":["bl"]},{"q":"Izin konfirmasi, untuk case: \n\"Yumna membayar biaya keanggotaan studio pilates selama satu tahun menggunakan QRIS secara langsung di studio. Transaksi tersebut dicatat sebagai pembelian, dibayar lunas.\"\nBerarti nanti pencatatannya dibagi ke 4 triwulan selama tahun 2027 ya?","a":"Tidak perlu disebulankan, dicatat sesuai biaya 1 tahun yang dibayar.","p":"setuju","s":"innas","t":[]},{"q":"Pembelian barang secara langsung dari pedagang keliling, seperti komoditas sapu, menggunakan kode jenis pasar apa?","a":"Jenis pasar untuk pedagang keliling adalah Outlet/Toko Khusus.","p":"dikategorikan jenis outlet","s":"innas","t":["bl"]},{"q":"1. Pada buku 5. master komoditas terdapat komoditas SUMBANGAN UNTUK RUMAH IBADAH\nKapan kode untuk ini digunakan, karena tadi disampaikan kalau bukan konsumsi dan diberikan kepada pihak lain harus menggunakan kode komoditas 1211020001.\nJika kode cara perolehan 5 (diberikan kepada pihak lain), apakah kode komoditas harus 1211020001? Jika kode komoditas tidak 1211020001, apakah akan error di webentry?\n2. Kalau tidak salah, pada pendataan SHK toko yang berada <500m dari pasar maka dimasukkan dalam pasar tradisional. Apakah hal ini juga berlaku untuk SPKRT?","a":"1. Pending. 1211020 vs 1211044 sama-sama sumbangan.\n2. Tidak. Berdasarkan pengakuan responden.","p":"Untuk beberapa komoditas yang mempunyai kode lebih dari 1, akan digabung pengeluarannya dalam pengolahan akhir. Sehingga bisa bebas memilih kode komoditas yang mana saja yang narasinya masih ada unsur \"sumbangan\".","s":"innas","t":["bl","art"]},{"q":"Untuk membership/subscribe aplikasi secara tahunan apakah harus tetap dicatatkan per bulan?","a":"Tidak dicatat per bulan/tidak disebulankan, dicatat sesuai biaya yang dibayarkan oleh responden.","p":"Sama dengan pertanyaan no 22","s":"innas","t":["app"]},{"q":"Apakah ada batasan daycare dengan PAUD, karena saat ini banyak daycare dimana anak dididik dan stimulasi sesuai dengan usianya. Daycare dan PAUD ada di kelompok pengeluaran yang berbeda","a":"Biasanya PAUD secara resmi dan legal mengikuti syarat pendirian PAUD. Dan dari segi nama, biasanya daycare tidak menclaim sebagai PAUD.","p":"","s":"innas","t":["bl","adm"]},{"q":"Selama ini sewa rumah termasuk komoditas dengan bobot terbesar dalam diagram timbang. Apakah nilai imputasi rumah milik sendiri masuk ke komoditas sewa rumah, sehingga turut membentuk besarnya bobot tersebut? Atau ada yang ke kontrak rumah? Jika iya, kenapa masuk sewa rumah bukan kontrak rumah?","a":"Imputasi sewa rumah milik sendiri tidak serta merta langsung diimputasi ke komoditas sewa rumah/kontrak rumah. Terdapat beberapa opsi imputasi seperti diimputasi ke sesama makanan/non makanan atau diimputasi ke seluruh komoditas.","p":"pengolahan imputasi akan dilakukan di tahun 2028, sekarang fokus ke pencacahan","s":"innas","t":["bl"]},{"q":"Untuk contoh kode pembayaran kredit sepeda motor, misal Harga sepeda motor 24 juta, uang muka 3 juta dan cicilan sudah 3 juta, berarti ada 2 rincian:\n\n1. Sepeda motor diisi nilai 24 juta dengan kode kredit\n2. Uang muka dan cicilan diisi nilai 6 juta dengan kode tunai\n\napakah benar seperti ini?","a":"Betul","p":"setuju","s":"innas","t":["bl","adm"]},{"q":"1. Mahasiswa yang tinggal bersama beberapa orang dan tidak memiliki hubungan keluarga, jika salah satunya sudah bertindak sebagai kepala rumah tangga, bagaimana dengan yang lainnya untuk pengisian kode kolom 3 blok IV.1?? \n2. Tukar tambah emas perhiasan jika yang dicatat hanya nilai tambahnya apakah tidak under jika dibandingkan dengan nilai berat emas perhiasan yang baru??\n3. Berobat di dokter praktik tidak bayar karena ada BPJS ASN, apakah tetap dicatat??","a":"1. Pending.\n2. Pending.\n3.Tidak Dicatat","p":"1. Masukan ke kode 7 [Famili lain]\n2. Tukar tambah barang, isikan total harga barang yang baru, nilai tambahannya masukan ke dalam Blok VIII.4 R.7","s":"innas","t":["art"]},{"q":"1. Untuk ARTE yang tinggal jauh dari rumah tangga sampel, seperti anak SMP/SMA di boarding school atau KRT yang bekerja di luar daerah tetapi pulang secara periodik (kurang dari satu tahun), bagaimana pencatatan pengeluaran BL-p-nya?\n2. Tadi dijelaskan mengenai perbaikan rumah yang menambah nilai aset. Bagaimana dengan restorasi motor/mobil antik untuk hobi atau koleksi pribadi, yang juga dapat meningkatkan nilai kendaraan? Apakah biayanya tetap termasuk konsumsi karena bukan untuk usaha, atau masuk bukan konsumsi karena menambah nilai aset? Apa kriteria pembedanya?","a":"1. Bisa ditanyakan dengan pendekatan uang jajannya biasa dipakai untuk membeli apa saja karena biasanya pengeluaran anak SMA ke bawah masih dalam pemantauan orang tuanya.\n2. Pending","p":"2. Termasuk pengeluaran bukan konsumsi karena menambah nilai aset.","s":"innas","t":["sampel","bl","art"]},{"q":"1. Harga satuan (kolom 6) di dok BL untuk pembelian barang dalam jumlah banyak (grosir) apakah langsung nilai (7) dibagi jumlah (5) atau harga satuan yg berlaku secara eceran? karena td disebutkan perkalian kolom 5 dan 6 tidak harus sama dengan kolom 7?\n2. Apa batasan pasar modern, apakah harus menjual komoditas tertentu atau seperti apa?\n3. Outlet yang dekat dengan pasar tradisional apakah masuk pasar atau outlet,,atau ada syarat jarak?\n4. Bagaimana pencatatan makanan yg dibeli melalui gofood di BL?","a":"1. Boleh menuliskan harga satuan.\n2. Pasar modern menjual variasi komoditas yang sangat luas mencakup makanan dan non makanan + tidak ada proses tawar menawar.\n3. Tidak ada syarat jarak, sesuai pengakuan responden saja. Berbeda dengan SHK karena SHK berkaitan dengan jenis kuesioner yang digunakan dan hal ini terkait dengan anggaran pencacahan.\n4. Makanannya dicatat di HR, ongkirnya dicatat di BL.","p":"setuju","s":"innas","t":["bl","hr","adm"]},{"q":"di buku pedoman KUESIONER VPKRT27-BL DAN VPKRT27-BLp halaman 51, tertulis:\n\n7. Pengeluaran iuran BPJS bagi Pegawai Negeri Sipil (PNS) dicatat sesuai nilai potongan BPJS pada rekap gaji bulanan. Sementara itu, iuran BPJS Mandiri dicatat sesuai nilai tagihan BPJS bulanan. Pengeluaran tersebut dicatat sebagai pengeluaran bukan konsumsi (kode 12)\n\nkode 12 tersebut untuk dimasukkan di bagian mana?","a":"Kode 12 maksudnya adalah kode komoditas diawali dengan 12. Narasi di buku pedoman akan diperjelas.","p":"Maksudnya kode 2 digit di awal.\nAkan diperjelas","s":"innas","t":["bl","art"]},{"q":"Untuk konsumsi komoditas jasa yang tidak digunakan saat masa periode pencacahan apakah tetap dicatat di BL?\nMisal membeli tiket pesawat di triwulan pendataan, namun tidak digunakan sehingga tiketnya hangus dan tidak dilakukan refund","a":"Tetap dicatat walaupun tiket tersebut hangus atau tidak jadi digunakan.","p":"Sama dengan pertanyaan No.12","s":"innas","t":["bl"]},{"q":"Slide 41:\nContoh 1 --> Note: Jika ongkos kirim menjadi Rp0 karena potongan, maka ongkos kirim tidak dicatat.\n\nvs\n\nContoh 2--> Peniti nilainya diperkirakan walaupun gratis.\n\nMengapa 2 barang yang sama-sama gratis, tapi yang satu nilainya diperkirakan dan yang satu nilainya tidak diperkirakan? Bagaimana pembedanya?","a":"Pending","p":"sudah di jawab pada pertanyaan No.15","s":"innas","t":[]},{"q":"Keponakan KRT yang tinggal di rumah untuk bantu bantu di rumah dan diberi uang bulanan itu ARTL atau ARTE ya ?","a":"Jika uang itu adalah bentuk lain dari gaji atas jasa bantu-bantu yang dilakukan oleh keponakan tsb, maka keponakan tsb dianggap sebagai ARTL.","p":"Jika uang bulanan sebagai balas jasa bantu-bantu dan rutin diberikan, maka dianggap sebagai ARTL","s":"innas","t":["art"]},{"q":"1. Izin mengkonfirmasi kembali bahwa di Buku Pedoman, KRT yang tinggal ditempat lain namun pulang secara periodik kurang dari 1 tahun tetap dianggap sebagai ART. Apakah konsep tersebut benar? Bagaimana pencatatannya pengeluarannya? Apakah seluruh pengeluaran KRT masuk di BLp dan HRp? Dan apakah memungkinkan ini dilakukan?\n2. Izin menegaskan kembali, jadi untuk layanan subscription (langganan spotify/youtube/gym/pilates/lainnya) yang pertiga bulan/pertahun dicatat saat jatuh tempo/bulan pembayaran, sedangkan untuk sewa/kontrak rumah dilakukan imputasi perbulan ya meskipun bayar per tahun?","a":"1. Betul, KRT yang PP < 1 tahun masih dianggap sebagai ARTE.\n2. Betul","p":"","s":"innas","t":["bl","hr","adm","art"]},{"q":"Bagaimana pencatatan pengeluaran konsumsi makanan apabila di dalam satu rumah tangga terdapat ARTL, dimana responden tidak dapat memisahkan pengeluaran yang dimakan oleh ARTL tersebut? (Misalnya dalam satu rumah, asisten rumah tangga yg menginap juga makan nasi, lauk, dan sayur yang dimasak untuk rumah tangga majikan nya)","a":"Pengeluaran makanan tersebut tetap dicatat sebagai pengeluaran ARTE. Untuk selanjutnya, proses pengolahan dalam webentry akan otomatis menghitung makanan yang diberikan ke ARTL yang menginap tersebut sebagai gaji dalam bentuk makanan dengan cara memproporsikan pengeluaran makanan terhadap jumlah ARTL dan Bukan ART yang ikut makan yang dimiliki oleh rumah tangga tsb.","p":"","s":"innas","t":["bl","art"]},{"q":"1. Untuk barang non konsumsi yang digunakan untuk usaha, jika ART sebagai pemilik usaha, namun yang bertugas membeli bahan baku usaha adalah pegawai lain yang bukan ART apakah tetap dicatat baik di BL atau HR jika responden sampel tidak mengetahui apa saja yang dibeli?\n2. Untuk kepala rumah tangga yang pulang hanya 1 kali per tahun apakah tetap masuk sebagai KRT? atau berapa lama batasan waktu pulang bagi KRT?","a":"1. Ya, pengeluaran tersebut tetap dicatat sebagai pengeluaran bukan konsumsi untuk usaha (dicatat di Kuesioner S Blok VII.2), dengan nama komoditas yang tidak perlu dirinci menjadi komoditas spesifik, misalnya nama komoditasnya cukup dengan memilih di antara: Pembelian Barang Atau Bahan Baku Untuk Usaha, Pembelian Alat Untuk Usaha, dll (tidak perlu dirinci menjadi palu, bayam, dll).\n2. Ya, KRT yang pulang-pergi maksimal 1 tahun sekali tetap dianggap sebagai ARTE. Batas waktunya maksimal 1 tahun.","p":"","s":"innas","t":["sampel","bl","hr","s","art"]},{"q":"1. Bagaimana pencatatan pembelian bahan makanan yang nantinya diberikan ke rumah tangga lain? misal seorang anak (yg sudah menikah) setiap bulan membeli beras sekarung yang nantinya akan diberikan ke orang tuanya yang sudah berbeda rumah tangga? apakah dimasukkan ke dokumen BL sebagai pengeluaran pemberian kepada pihak lain?\n2. Rumah tangga usaha pertanian (misal hortikultura sayur kangkung dan cabai rawit), saat panen, selain dijual, sebagian juga diberikan ke rumah tangga lain (tetangga, saudara, orang tua, dll), apakah dicatat juga di BL sebagai pengeluaran pemberian kepada pihak lain (dengan imputasi nilainya)?\n3. Pendataan dok KK apakah dilakukan oleh setiap pengawas? mengingat di kabupaten jumlah pasar tradisionalnya (pasar besar/cukup lengkap) hanya 1 atau 2 pasar","a":"1. Betul diberikan kode 1211020001.Pengiriman,hadian,pemberian kepada Pihak Lain\n2.Iya..sama dengan nomor 1\n3.Mekanisme pendataan kami serahkan ke bapak dan ibu di kabkota, tetapi setiap pengawas dibebankan tugas untuk memiliki data konversi,melalui kuesioner KK","p":"","s":"innas","t":["bl"]},{"q":"1. Bagaimana cara mencatat komoditas jumlah dan satuan untuk komoditas bumbu dapur yang penggunaannya hanya sedikit2? boleh ga catetnya 1 kali aja, yaitu perkiraan yang digunakan selama 1 minggu?\n\n2. siapa yang menandakan tanda \"p\"? responden?\n\n3. bagaimana pencatatan komoditas minyak goreng yang dipakai berkali kali?","a":"1. Dperkenankan selama konsumsi selama 1 minggu itu masih bisa tergambarkan,dan nilainya \"wajar\"\n2. Tanda p diberikan pencacah, untuk memberikan petunjuk bagi pengawas\n3. probing yang bisa dilakukan adalah,ketika membeli minyak goreng abru,misal sebesar 1 liter,ini habis untuk berapa hari, tanpa memperhitungkan untuk penggunaan minyak tanah habis pakainya","p":"","s":"innas","t":["bl"]},{"q":"Untuk pasar modern harus menjual berbagai bahan makanan dan non-makanan, namun sebelumnya pernah ada yg mengatakan kalau toko modern yang merupakan sampel SHK 'harus' menjual daging. Apakah benar demikian? (maaf diluar konteks sedikit)","a":"Pengertian Pasar Modern dalam konteks HK,di tempat tersebut bisa ditemukan komoditas-komoditas untuk pendataan Survei harga Konsumen, jadi tidak hanya komoditas mingguan..mengenai komoditas daging ,ikan segar atau sayur dan buah, jika tersedia itu leboih bagus tetapi untuk kabkota lain bisa jadi sulit ditemui,pendekatannya bisa didata dengan kuesioner Hk 1.1,HK 1.2 dan Hk bulanan dalam hal ini HK 2.1","p":"","s":"innas","t":["sampel","bl"]},{"q":"1. Izin konfirmasi, tanda ‘p)’ seharusnya diberikan pada kolom (5) atau kolom (6)? Pada Buku 3 halaman 32 disebutkan kolom (5), tetapi pada contoh pengisian tanda tersebut ditempatkan di kolom (6). Ketentuan mana yang menjadi acuan?\n2. Maaf bertanya sedikit ke HK, di Kalimantan Timur ada wilayah seperti Kabupaten Mahakam Ulu yang rumah tangganya membeli bahan makanan di kabupaten/kota lain. Jika hasil SPKRT menunjukkan nilai konsumsi komoditas tersebut tinggi, tetapi komoditas atau penjualnya sulit ditemukan di wilayah asal untuk pencacahan harga konsumen, bagaimana perlakuannya dalam penetapan paket komoditas dan pencacahan harganya?","a":"1. Ini akan dikoordinasikan dengan kelas lain, tetapi intinya isian dengan kode P,baik itu dikolom 5 atau kolom 6, sebagai petunjuk atau warning untuk pencacah dan pengawas bahwa rincian barang/jasa tersebut bukan berasal dari pembelian di pasar dll, dan dari sisi harga merupakan \"harga perkiraan\", harga perkiraan ini yang perlu diperhatikan apakah nilainya wajar atau tidak.\n2.Penetapan paket komoditas akan kita bahs secara mendalam setelah SPKRT selesai, jiak memang tidak ditemukan tempat pencacahan di kab tersebut,maka komoditas tersebut tidak bisa dijadikan Pakom,karena salah satu syarat nya adalah terkait keberlangsungan pencacahan selama 5 tahun kedepan.","p":"","s":"innas","t":["bl","art"]},{"q":"1. jika ada ART yang memiliki usaha rumah makan dan sehari-hari mengambil makan. Bagaimana cara pencatatan pengeluarannya?","a":"Jika pengeluarannya bisa dirinci menurut komoditas, maka dicatat per komoditas. Namun jika tidak bisa dirinci, maka makanannya dapat dianggap sebagai makanan jadi, misalnya soto/nasi dengan lauk/dll.","p":"","s":"innas","t":["bl","art"]},{"q":"Sepertinya sulit untuk meminta responden memproporsi nilai dari yg dikonsumsi terutama yang ukurannya sedikit, misal garam 1 sendok teh. Apakah boleh kalau nilainya diproporsi oleh petugas saja? Atau tetap meminta responden mengisi kemudian petugas melakukan perbaikan? Apakah ada prosedurnya?","a":"Petugas boleh melakukan perbaikan isian kuesioner, sepanjang dilakukan probing terlebih dahulu. Misalnya responden hanya mengetahui pemakaian 1 sdt namun sulit menghitung nilai konsumsinya, maka pencacah dapat memprobing kira-kira 1 bungkus barang tersebut berisi berapa gram dan biasanya habis dalam berapa hari.","p":"","s":"innas","t":["bl"]},{"q":"1. Pembelian barang yg lunas/tunai dengan menggunakan kartu kredit apakah tetap dianggap pembelian dibayar kredit? Karena status pembelian barang lunas di toko, namun yg dicicil adalah pembayaran ke perusahaan/bank kartu kredit\n2. Kasus di beberapa wilayah yg tidak tersedia pengeluaran untuk komoditas yang harus tercatat setiap bulan misalnya: listrik PLN dan PDAM apakah biayanya perlu diimputasi? Jika diimputasi apakah nilainya ditentukan oleh pusat? Beberapa wilayah belum ada listrik pln, listrik biasanya menggunakan genset, panel surya, dan lainnya. Air yg digunakn untuk kebutuhan sehari-hari juga menggunakan air hujan\n3. Di beberapa wilayah pedalaman/terpencil jaringan seluler/internet juga tidak tersedia, apakah nantinya perlu imputasi juga? atau dianggap riil tidak ada?\n3. Untuk imputasi sewa rumah milik sendiri apakah kondisi kosongan? atau termasuk furniture?\n4. Untuk pembelian makanan/minuman konsumsi dengan merk sama di hari yang sama, tapi jenis pasar berbeda, misalnya membeli teh kotak, pagi membeli di kios di samping rumah dan malam membeli di supermarket, apakah pencatatannya harus dipisah? atau boleh dijadikan satu? jika boleh dijadikan satu jenis pasarnya dipilih yg mana?\n5. Jika membeli makanan secara online di aplikasi grab food, harga makanan masuk di kuesioner HRp dan HR. untuk biaya layanan dan ongkir berarti masuknya di kuesioner BL dan BLp ya?\n6. Ketika pemutakhiran, dalam ruta tercatat ada ART yg bekerja/menerima penghasilan. Misalnya pendataan telah selesai dilakukan hingga bulan kedua, dan trnyata ketika pendataan kuesioner S, responden menginfokan bahwa ART yg bekerja terkena PHK, sehingga di bulan ketiga tidak tersedia ART yg bekerja/menerima penghasilan di ruta tsb. \n- Apakah ruta ini masih dianggap ? Jika tidak dan ganti sampel, apakah untuk pendataan BL-1 dan BL-2 dilakukan recall dengan kuesioner S? lalu untuk pengeluaran bukan makanan bulan ketiga menggunakan BL-3? \n- Jika masih dianggap , berarti pendapatan yg diisi apakah pendapatan dua bulan terakhir saja?\n7. Biaya jasa perantara yg ilegal, seperti calo dalam pembuatan sim apakah dicatat?","a":"2. Sejauh ini yang perlu diimputasi hanya responden yang merupakan pelanggan PLN saja.\n5. Betul\n6. Tetap dianggap , tidak perlu ganti responden. Isi pendapatan saat masih bekerja saja.\n7.","p":"","s":"innas","t":["sampel","bl","hr","s","adm","app","art"]},{"q":"Izin konfirmasi terkait pengisian kuesioner VPKRT27-KK:\n1. Apakah penimbangan untuk konversi satuan merupakan kegiatan khusus atau bagian dari pengawasan?\n2. Apakah tersedia biaya transportasi?\n3. Apakah cukup dilakukan pada TW I atau setiap triwulan, terutama jika ukuran satuan setempat berubah?","a":"1. Konversi satuan di KK merupakan kegiatan tersendiri karena memang harus dilakukan jika terdapat komoditas makanan di HR yang satuannya belum standar.\n2. Tersedia translok namun perlu dikonfirmasi kembali apakah translok ini dikhususkan untuk kegiatan pencacahan KK atau tidak.\n3. Dilakukan setiap triwulan secara independen karena merupakan bagian dari SOP pencacahan SPKRT dimana isian KK melekat pada dan nyambung dengan isian HR di triwulan yang bersangkutan.","p":"","s":"innas","t":["bl","hr","adm","art"]},{"q":"Kalo responden mengambil sayur yang tumbuh liar di hutan/kebun atau berburu hewan di hutan untuk dikonsumsi, cara perolehan diisi kode 2 (lainnya), kemudian jenis pasarnya diisi kode berapa ya?","a":"Disepakati untuk diisi kode 1 (pasar tradisional).","p":"","s":"innas","t":["bl"]},{"q":"Tadi sempat dibahas kalo responden makan dari warung makan milik sendiri, dan tidak bisa merinci komoditasnya, bisa dicatat 1 komoditas nasi dengan lauk. Apakah hal tersebut juga berlaku jika responden dapat nasi kotak dari acara atau makan di pesta orang lain atau ada ARTE yang menerima MBG juga bisa dicatat komoditasnya nasi dengan lauk?\nKemudian jika mendapat snack box yang berisi berbagai macam kue apakah pencatatan pada kuesioner harus dipisah per masing-masing jenis kue?","a":"1. Ya, menerima nasi kotak dari hajatan bisa dianggap menerima nasi dengan lauk, namun anak sekolah yang menerima makan siang dari MBG tidak perlu dicatat karena merupakan target dari pengeluaran pemerintah.\n2. Pending","p":"","s":"innas","t":["bl","art"]},{"q":"bagaimana pencatatan MBG Pak/Bu ?","a":"Anak sekolah yang menerima makan siang gratis dari MBG, maka tidak perlu dicatat karena pengeluaran tsb akan dicatat dalam neraca pemerintah.","p":"Setuju","s":"innas","t":["bl"]},{"q":"untuk asisten rumah tangga yg tidak menginap dan makan siangnya ditanggung ruta sampel, apakah nilai konsumsi makan siangnya dicatat di HR walaupun bukan anggota rumah tangga? karena di buku pedoman ditulis \"Upah asisten rumah tangga berupa makanan dan minuman, yaitu nilai makanan dan minuman yang dikonsumsi asisten rumah tangga. Upah ini tidak perlu ditanyakan oleh pencacah kepada rumah tangga sampel, karena nilainya akan diperoleh dari hasil perkalian nilai konsumsi makanan dengan proporsi jumalah asisten ruta/total asisten ruta\"","a":"Ya seperti pertanyaan 40, dicatat sebagai pengeluaran rumah tangga dan akan dihitung secara otomatis oleh webentry sebagai upah dalam bentuk makanan.","p":"","s":"innas","t":["sampel","bl","hr","art"]},{"q":"1. indomaret dsni ada indomaret super yang ukuran lebih besar dari indomaret biasa dimana indomaret super juga menjual buah-buah segar, apakah masuk pasar modern?\n2. td penjelasan alfimidi sepakat masuk pasar modern. di sini kebanyakan alfamidi menjual bahan makanan segar hanya berupa buah segar sedangkan daging dan sayur tidak ada. Apakah tetap masuk pasar modern?","a":"1. Jika variasi barang yang dijual sangat beragam sehingga dalam pendataan SHK bulanannya dapat mendata berbagai macam kuesioner (HK 1.1, HK 1.2, dll), maka dianggap sebagai pasar modern. Kata kunci pasar dalam SPKRT dan SHK digunakan untuk lokasi berbelanja yang menjual variasi barang yang sangat beragam.\n2. Ya, alfamidi dianggap sebagai pasar modern karena variasi barang yang dijual cukup beragam.","p":"","s":"innas","t":["art"]},{"q":"Dengan pengelompokan Indomaret Fresh, Alfamidi, dan sejumlah ritel lokal sebagai pasar modern, bobot pasar modern untuk barang pabrikan berpotensi menjadi besar.\n\nBerdasarkan pengalaman SHK, pergerakan harga barang pabrikan di ritel sering dipengaruhi diskon dan promo. Ketika masuk 10 besar penyumbang inflasi atau deflasi, fenomenanya cukup sulit dijelaskan karena berkaitan dengan perubahan promo masing-masing ritel.\n\nApakah bobot jenis pasar sepenuhnya mengikuti hasil SPKRT masing-masing daerah, atau ada penyesuaian maupun standar proporsi bobot dari pusat?","a":"Berdasarkan SBH 2022, bobot jenis pasar mengacu pada hasil SBH/SPKRT dan akan diperiksa kembali kewajarannya oleh BPS provinsi/kabkota.\nRisiko bobot pasar modern menjadi tinggi dalam penghitungan inflasi bulanan akibat mengelompokkan Alfamidi/Indomaret Fresh sebagai pasar modern, perlu dijelaskan lebih lanjut dalam penegasan.","p":"","s":"innas","t":["bl","art"]},{"q":"1. Di HR, untuk makanan yang sifatnya paketan bagaimana pencatatannya misal di McD, ada fried chicken, burger, dan coca cola?\n2. Lalu untuk makanan yg didapatkan dari tebus murah dengan minimal belanja tertentu dan promo dari kepemilikan membership berarti tetap dicatat sesuai nilai yang dikeluarkan?","a":"1. Pending ditanyakan juga di kelas sebelah.\n2. Betul.","p":"","s":"innas","t":["hr"]},{"q":"1. Seseorang yang tidak mempunyai ikatan keluarga dengan KRT dan numpang tinggal di rumah tersebut karena sedang kuliah, sebagai balas budi dia bantu-bantu beberes dan memasak tapi tidak digaji, masuk ARTE atau ARTL??, Jika ARTE kode kolom 3 nya apa??\n2. Jika ada ART yang besekolah di sekolah negeri/swasta, tidak membayar SPP karena ada dana BOS. apakah tetap diimputasi untuk uang SPP nya??","a":"1. ARTL, kode hubungan dengan KRT: lainnya (kasusnya mirip dengan Anak asisten rumah tangga yang tinggal bersama dalam rumah tangga dicatat sebagai asisten rumah tangga apabila diperlakukan sebagai asisten rumah tangga. Namun, apabila anak tersebut tidak diperlakukan sebagai asisten rumah tangga, maka status hubungan dengan kepala rumah tangga dicatat sebagai lainnya).\n2. Buku 2 Subbab 2.5 poin 8:\nBantuan yang diterima langsung oleh rumah tangga, seperti Kartu Indonesia Pintar (KIP) Kuliah, Bantuan Operasional Sekolah (BOS), Cek Kesehatan Gratis (CKG), dan bantuan pemerintah lainnya tidak dicatat karena merupakan pengeluaran Pemerintah, bukan pengeluaran rumah tangga.","p":"","s":"innas","t":["bl","art"]},{"q":"Makanan jadi (seperti bakso, mi ayam, dan sejenisnya) yang diberikan kepada Pembantu Rumah Tangga yang menginap (ARTL), apakah pengeluaran tersebut dicatat dalam Kuesioner HR sebagai pengeluaran konsumsi rumah tangga, atau dicatat dalam BL sebagai pengeluaran bukan konsumsi?","a":"Kesepakatannya dicatat sebagai pengeluaran rumah tangga dan dicatat di HR.","p":"","s":"innas","t":["bl","hr","art"]},{"q":"Buatkan daftar komoditas apa saja yang cara pencatatan harganya harus disebulankan, dan komoditas apa saja yang tidak perlu disebulankan.\nMisalnya di atas biaya gym/pilates 1 tahun tidak perlu disebulankan. Adakah daftar komoditas serupa?","a":"To follow up: Daftar komoditas akan dibuat.","p":"","s":"innas","t":["bl"]},{"q":"Untuk konsumsi makanan dengan cara perolehan kode 2 (Lainnya):\n1. Untuk produksi sendiri, responden yang menanam sayur atau ubi sendiri, jenis pasar yang diisikan kode berapa?\n2. Untuk pemberian, kasus dimana ARTE bekerja di dapur MBG, dan setiap hari nya membawa makanan sisa dari dapur MBG tersebut, bagaimana pengisian kode jenis pasar nya?","a":"Kesepakatan:\n1. Kode jenis pasar: 1 (pasar tradisional).\n2. Karena responden bukan target penerima MBG dari pemerintah, maka dicatat sebagai pengeluaran di kuesioner HR dan dianggap pula sebagai pendapatan di kuesioner S Blok VIII.\nRALAT JAWABAN NO. 2:\nTidak dicatat sebagai pengeluaran/pendapatan karena merupakan pengeluaran pemerintah dan tercatat di neraca pemerintah.","p":"2. Tidak dicatat sebagai pengeluaran/pendapatan karena merupakan pengeluaran pemerintah dan tercatat di neraca pemerintah.","s":"innas","t":["bl","hr","s","art"]},{"q":"Jika sarana angkutan yang digunakan untuk pergi dan pulang berbeda, misal anak pergi ke sekolah diantar bapaknya menggunakan motor pribadi sekalian berangkat kerja, tapi pulangnya anak tersebut naik ojek. Bagaimana menentukan sarana angkutan yang digunakan untuk sekolah?","a":"Masukkan yang berbayar","p":"","s":"innas","t":[]},{"q":"Rincian 12, langganan aplikasi apakah harus original (langsung ke penyedia aplikasi) atau termasuk yg melalui perantara (seperti yg dijual di shopee)?","a":"Dari penyedia aplikasi dan perantara dicatat semua","p":"","s":"innas","t":["app"]},{"q":"Istri menemani suami perjalanan dinas ke beda kab/kot. Apakah rincian 13 Blok V berkode 1?","a":"Perjadin untuk suami, kl pegawai negeri karena dibiayai pemerintah, tidak dicatat, tapi kalau pegawai swasta dicatat. Kl istrinya, karena tidak dibiayai pemerintah, dicatat","p":"","s":"innas","t":[]},{"q":"Konsep baby sitter apakah hanya terbatas seperti di buku pedoman (memakai seragam)?","a":"Hingga saat ini, baby sitter adalah yang memiliki sertifikat resmi sebagai baby sitter, bukan sekedar menjaga anak karena ini adalah asisten rumah tangga. Namun belum ditentukan apakah baby sitter dan asisten rumah tangga ini akan digabung menjadi upah pekerja rumah tangga dengan mengacu pada UU Kementerian Ketenagakerjaan.","p":"","s":"innas","t":[]},{"q":"Pegawai/karyawan yang melakukan perjalanan dinas tidak rutin mengapa tetap dikategorikan sebagai melakukan perjalanan?","a":"Tidak memandang rutin/tidak rutin. Pending","p":"","s":"innas","t":[]},{"q":"1. R.12 pertanyaannya untuk rumah tangga secara keseluruhan? atau salah satu ARTE saja menguasai,berarti isiannya kode \"1\" juga? \nmisal seseorang menguasai layanan digital berbayar karena fasilitas kantor, apakah itu pilihan di R.12 tetap kode 1?\n\n2. Blok V untuk periode selama 3 bulan, pada pertanyaan sumber utama air minum, misal pada bulan 1 dan 2 rumah tangga tsb minum pakai Aqua, karena downgrade kehidupan di bulan ke3 (saat pencacahan berlangsung) air minum utamanya berubah menjadi air isi ulang, maka isian untuk rincian tersebut mau diisi apa?","a":"1. Salah satu ARTE sudah dianggap menguasai\n2. Air isi ulang","p":"","s":"innas","t":["art"]},{"q":"1. Apakah rekapitulasi BL 1 dan BL 2 bisa dicetak jika BL 2 belum entri (untuk kasus tw 1)? sebab pada SBH 2022 seingat kami jika entrian BL 1 dan BL 2 ada error tidak bisa dicetak rekapitulasinya\n2. Maksud Jumlah (selama dua bulan kalender) (blok VI kolom 7) bagaimana? jumlah terisi tiap bulannya atau jumlah konsumsinya sebab di contoh slide bahan ajar (asisten pak tommy tiap bulan dapat 10 kg beras, tetapi kolo Jumlah (selama dua bulan kalender) terisi 2 bukan 20 kg)?","a":"1. Diisi 2, karena jumlah satuan pembayaran pembantu adalah bulanan","p":"","s":"innas","t":["bl","s","jadwal","adm"]},{"q":"1. Izin memberi saran kalau bisa di bahan ajar untuk petugas nanti dilengkapi dengan contoh gambar untuk rincian jenis lantai, jenis dinding, dan jenis atap (seperti contoh gambar di rincian bahan bakar utama untuk memasak). Karena walaupun pertanyaan ini sudah sering ditanyakan di berbagai survei, tapi masih banyak petugas yang bingung membedakan jenis lantai, dinding, atap.\n\n2. Jika menggunakan mata air terlindung yang dikelola desa dan responden membayar iuran rutin bulanan, termasuk cara perolehan air dengan membeli atau langganan?\n\n3. Melakukan pengobatan apakah termasuk minum obat herbal (rebus daun-daunan/akar-akaran) dengan racikan sendiri?","a":"1. Dicatat\n2. Apakah jika tidak menggunakan tetap bayar (seperti abodemen/administrasi)? Kalau iya, berarti berlangganan\n3. Iya","p":"","s":"innas","t":["bl"]},{"q":"Konfirmasi terkait pengisian VPKRT27-S:\n1. Jika pengeluaran bulan pertama atau kedua baru diketahui saat pengisian S, apakah cukup dicatat pada S, atau BL dan hasil entrinya juga harus diperbaiki?\n2. Jika responden mengoreksi nilai pengeluaran yang sudah tercatat di BL 1 dan 2 saat wawancara S, bagaimana mekanisme koreksinya?","a":"1. Cukup dicatat di S\n2. Hasil entri di BL bulan 1 dan bulan ke 2 tidak perlu dikoreksi","p":"","s":"innas","t":["bl","s","art"]},{"q":"Untuk rincian pengeluaran yang belum tercatat di BL, lalu sudah dicatat di kuesioner S, Apakah perlu disalin kembali isian pengeluaran yang belum tercatat tersebut ke kuesioner BL?","a":"Tidak perlu disalin kembali ke BL bulan 1 dan bulan 2.","p":"","s":"innas","t":["bl","s"]},{"q":"Untuk pertanyaan Blok IV.1 kolom 10 dan 11 tidak ada instruksi \"hanya ditanyakan jika berstatus masih sekolah\" ya? atau memang perlu ditanyakan ke semua ARTE?","a":"Ditanyakan kepada ARTE yang berstatus sekolah","p":"","s":"innas","t":["art"]},{"q":"Kendaraan umum dgn rute tertentu apakah maksudnya yang ada tempat pemberhentian yg sudah ditetapkan? Kalau ada rute (misal kota gorontalo - kab pohuwato) tapi bisa dijemput di tempat yg ditentukan penumpang itu masuknya ke tanpa rute?","a":"Masuk kendaraan umum dengan rute","p":"","s":"innas","t":[]},{"q":"- TIdak ada keterangan kode untuk pengisian kues S blok VI kol (5) dan (6), apakah diasumsikan petugas sudah hafal kodenya?\n- untuk pengeluaran biaya menginap hotel include breakfast, apakah perlu dipisah untuk biaya akomodasi dan makanan?","a":"1. Ada di kuesioner untuk kolom 6","p":"","s":"innas","t":["bl","s"]},{"q":"Bagaimana tata cara pengisian pengeluaran konsumsi bukan makanan di blok VI untuk rincian:\n1. Listrik, apabila listrik sudah dibayar oleh penghuni rumah dinas sebelumnya, sehingga di triwulan 1 ini pengeluaran listrik nya hanya Rp50.000, apakah perlu di imputasi listrik nya?\n2. Obat-obatan dan jasa rawat jalan yang diperoleh gratis dari puskesmas (menggunakan BPJS) apakah perlu di imputasi?\n3. Peralatan/Produk Kesehatan yang diperoleh gratis dari perusahaan tempat bekerja apakah perlu di imputasi?\n4. Pengeluaran konsumsi pendidikan yang gratis (sekolah negeri) apakah perlu di imputasi?","a":"1. Tidak perlu diimputasi, bayarkan yg sesuai bulan, berikan penjelasan di blok catatan\n2. pemberia dari pemerintah/BPJS tidak perlu diimputasi nilainya\n3. Perlu diimputasi\n4. Uang sekolah gratis tidak perlu diimputasi","p":"","s":"innas","t":["bl","s"]},{"q":"seseorang yang menumpang kendaraan temannya menuju kantor, tapi ikut patungan dalam membayar bensin, sarana angkutannya tetap \"Lainnya\"?","a":"jika menumpang masuk ke angkutan umum lainnya (tanpa rute)","p":"","s":"innas","t":[]},{"q":"Listrik PLN Token yang dibayar/dibeli utk beberapa bulan apakah wajib isian listrik tiap bulan terisi di BL atau hanya di bulan pembelian?","a":"Wajib diperkirakan bulanan. pending","p":"","s":"innas","t":["bl"]},{"q":"Untuk komoditas2 yang dilakukan imputasi apakah harus dicatat juga di blok pendapatan?","a":"Iya","p":"","s":"innas","t":["bl","s"]},{"q":"Apakah bisa meminta contoh pengisian lengkap kuesioner S? karena di buku 3 tidak ada contoh pengisian lengkapnya","a":"Kuesioner S cukup tebal jika dimasukkan ke buku pedoman","p":"","s":"innas","t":["s"]},{"q":"kalau tidak salah, dijelaskan untuk kuesioner S Blok VI kolom 4-8 hanya terisi jika komoditas tidak tercentang dua kali, apakah ini sudah ada di buku pedoman?","a":"Terisi jika ada pengeluaran komoditas, yang terlewat pencacahan di BL 1 dan BL 2. Jika komoditas memang tidak dikonsumsi di bulan 1 dan bulan 2 pencacahan (setelah ditanyakan/dikonfirmasi pencacah tidak ada konsumsi), maka bisa saja kolom 4-8 tetap kosong, walaupun tidak ada tanda cek.","p":"apa bisa penjelasan ini masuk ke buku pedoman?","s":"innas","t":["bl","s"]},{"q":"Di Buku2 Halaman 11 Pada penjelasan Kode 4 “Pemberian dari pihak lain selain rumah tangga” disebutkan bahwa pemerintah merupakan salah satu pihak pemberi. Namun pada Ketentuan Khusus Pencatatan Pengeluaran Bukan Makanan Rumah Tangga angka 8 disebutkan bahwa bantuan yang diterima langsung oleh rumah tangga, seperti KIP Kuliah, BOS, CKG, dan bantuan pemerintah lainnya tidak dicatat karena merupakan pengeluaran pemerintah. Mohon penjelasan mengenai batasan/kriteria pemberian dari pemerintah yang harus dicatat menggunakan Kode 4 dan bantuan pemerintah yang tidak dicatat. Apakah Kode 4 ditujukan untuk pemberian barang/jasa tertentu dari pemerintah yang bukan merupakan program bantuan pemerintah, atau terdapat kriteria lain yang membedakannya?","a":"Pemberian dari pemerintah tidak dicatat","p":"","s":"innas","t":["bl"]},{"q":"kalau responden membeli emas berupa perhiasan untuk disimpan dan akan dipakai sesekali pada momen tertentu, apakah dimasukkan ke investasi atau konsumsi?","a":"Kalau niatnya dari awal untuk disimpan, maka masuk ke investasi.","p":"","s":"innas","t":["bl"]},{"q":"Berarti meskipun tidak berbadan hukum tapi bisa memisahkan keuangannya (tidak ada laporan tertulis, tapi bisa diprobing), tidak perlu dicatat kan pak?","a":"Tidak perlu dicatat, apalagi untuk usaha yang skalanya bukan usaha rumah tangga misalnya usaha kecil/menengah/besar.","p":"","s":"innas","t":[]},{"q":"dokumen S Blok VII.1 ada rincian bukan konsumsi: Top Up Dompet Digital Dan Uang Elektronik, bukannya di BL itu tidak dicatat karena hanya pemindahan dana yaa? atau saya yg terlewat yaa pak?","a":"Top up dompet digital dicatat apabila tujuannya untuk menabung.\nTop up dompet digitalyang tidak dicatat apabila tujuannya untuk dibelanjakan ke pembelian komoditas.","p":"","s":"innas","t":["bl","s"]},{"q":"Responden triwulan 1 2027 merupakan pemilik rumah kontrakan dimana pendapatan kontrak rumah diperoleh pada Desember 2027 senilai Rp12.000.000, apakah pendapatan tsb dicatat senilai Rp3.000.000 di kuesioner S triwulan 1 2027 atau tidak perlu dicatat sama sekali?","a":"Pendapatan dicatat senilai Rp3.000.000 di kuesioner S triwulan 1 2027.","p":"","s":"innas","t":["s"]},{"q":"1. Kerugian atas kepemilikan saham (realized loss) apakah dicatat di pengeluaran bukan konsumsi untuk usaha? Apa rinciannya ya pak?\n2. Kemudian untuk pembayaran hutang, apakah perlu dipisahkan untuk usaha dan bukan untuk usaha?","a":"1. \n2. Utang untuk usaha (hanya untuk usaha skala rumah tangga, bukan usaha yang punya pembukuan/badan hukum) dan utang rumah tangga digabung saja dalam 1 kode komoditas.","p":"","s":"innas","t":["bl","adm"]},{"q":"untuk rumah tangga yang mengambil sayuran (misalnya sayur pakis yg ada di hutan) dan ubi2an di lahan yang bukan miliknya (memungut), pendapatannya dicatat di rincian mana ya pak untuk Kuesioner S blok VIII nya?","a":"Pengeluaran dicatat di HR (dengan harga perkiraan).\nPendapatan dicatat di S Blok VIII.2.B Rincian 04 Hasil Pertanian.","p":"","s":"innas","t":["bl","hr","s"]},{"q":"Untuk imputasi ini apakah mengkonsumsi hasil sendiri misalnya pada pertanian, atau pedagang yg mengkonsumsi barang dagangan atau dokter mengobati dirinya sendiri juga diimputasi di BL jadi respomden harus disampaikan untul mengisi ini ? Ataukah ini menjadi tugas petugas untuk wawancara di S ?","a":"Selama responden memberi keterangan bahwa responden mengkonsumsi jasa yang diproduksi sendiri, maka pencacah melakukan balancing di S.\nKecuali pencacah bisa memprobing dengan sangat baik, maka dicatat di S dan BL.\nPenekanan konsep lebih ditekankan ke pencacah, bukan ke responden.","p":"","s":"innas","t":["bl"]},{"q":"Mungkin perlu tambahan catatan di buped terkait sewa/kontrak tadi pak, karena disini tertulis bahwa pendapatan yang diterima di luar periode survei tidak dicatat?","a":"To follow up: Akan diperbaiki dan disampaikan ke master intama.","p":"","s":"innas","t":["s"]},{"q":"untuk sampel yang telah diganti, isian VPKRT27-BL sebelumnya apakah perlu dientri pak?","a":"Akan disampaikan ke Tim SIS (pengolahan) karena terkait dengan honor dan akan dicek terlebih dahulu.","p":"","s":"innas","t":["sampel","bl","adm","art"]},{"q":"1. Jika menerima arisan dalam bentuk barang, misalnya arisan selama 10 bulan mendapat air fryer di Februari 2027, apakah dicatat juga sebagai pendapatan di S Blok VIII.4 (Menerima arisan)?\n2. Jika responden belanja sayur untuk stok satu minggu, lalu ada beberapa sayur yang tidak dimasak karena sudah busuk/layu, apakah pengeluaran sayur tersebut dicatat?","a":"1. Tidak dicatat sebagai pendapatan di S BLok VIII.4 karena \"menerima arisan\" yang dicatat hanya dalam bentuk uang. Jadi hanya dicatat sebagai pengeluaran konsumsi air fryer di BL Februari 2027. Pengeluaran bukan konsumsi bukan untuk usaha: iuran arisan.","p":"","s":"innas","t":["bl","s"]},{"q":"Apakah pemberian pemerintah dicatat sebagai pendapatan di Kuesioner S Blok VIII.1?","a":"Pemberian pemerintah tidak dicatat sebagai pendapatan di Kuesioner S Blok VIII.1.\nKuesioner akan diperbaiki.","p":"","s":"innas","t":["s"]},{"q":"Jika semua pemberian dari pemerintah tidak dicatat, maka pengeluaran yang bersumber dari pemberian pemerintah (berbentuk uang tunai) dan pengeluaran yang bersumber dari nonpemerintah sulit dipisahkan.\nBagaimana cara memisahkan kedua pengeluaran tsb?\nRisiko tambahan: Jika pengeluaran dibandingkan dengan pendapatan bisa jadi tidak balance.","a":"Responden yang menerima bantuan tunai dari pemerintah dan uang tsb digunakan untuk membeli barang/jasa, maka pengeluaran tsb tetap dicatat. Tetapi pendapatan dari pemerintah tidak perlu dicatat.","p":"apa tidak masalah jika balancingnya lebih/kurang dari 20 % karena pendapatan dari pemerintah tidak dicatat?","s":"innas","t":["bl","s"]},{"q":"BL itu sistemnya ditarik dari responden kemudian diganti yang baru, seperti itu? 1 kuesioner mendapat 3 BL yang diserahkan tiap bulan?","a":"Ya, di bulan pertama datang, menaruh BL dan menjelaskan cara pengisian. Kemudian di bulan kedua ditarik dan diberikan BL kembali","p":"","s":"innas","t":["bl"]},{"q":"Di Buku 4 (Pedoman Pemeriksaan Dokumen), pengawas diinstruksikan untuk meneliti kebenaran dokumen BLp dan HRp\n. Namun, pedoman tidak mengatur status retensi dokumen pribadi tersebut setelah disalin. Jika terjadi perbedaan klasifikasi nama komoditas atau nominal antara catatan asli responden di kuesioner pribadi (BLp/HRp) dengan hasil salinan pencacah di kuesioner induk (BL/LK), dokumen mana yang menjadi rujukan kebenaran mutlak (single source of truth)?","a":"Seharusnya yang benar adalah BLp dan HRp (dokumen ini langsung diisi oleh responden)","p":"","s":"innas","t":["bl","hr"]},{"q":"Muatan di wilkerstat, di Sumut muatannya ada di luar wilayah\n\nKonsep wilkerstat belum ada di buku pedoman","a":"Mengikuti SE\n\n\nAkan diupdate dan ditambahkan.","p":"","s":"innas","t":[]},{"q":"Identifikasi terdapat 30 rumah tangga, sudah fix tidak ada tambahan atau penggantian. Jiika di lapangan tidak ditemukan, nanti DSPU bisa tidak berjumlah 30\n\n\nBangunan berdasarkan fungsi. Di SE terdapat bangunan campuran, berarti ke bangunan tempat tinggal saja?\n\nPindah dan dapat ditelusuri apakah harus di RT yang sama?","a":"Betul\n\n\n\n\n\n\nPindah dan dapat ditelusuri, dalam 1 SLS. Jika berbeda, maka tidak ditemukan.","p":"","s":"innas","t":["sampel"]},{"q":"Bagaimana perlakuan jika setelah identifikasi pada TW 1 dalam satu sls ruta eligible kurang dari 10?","a":"Akan mengakibatkan pergantian SLS, hal ini dapat terjadi salah satunya karena fakor alam (misal banjir). Untuk mengajukan pergantian, silahkan bersurat ke BPS RI","p":"","s":"innas","t":["sampel"]},{"q":"Bagaimana identifikasi atau perlakuan terhadap rumah tangga pasangan lansia pensiunan (2 orang ARTE yang keduanya sudah tidak bekerja/tidak berusaha dan hanya hidup dari uang pensiun atau transfer anak), namun mereka mempekerjakan dan menampung seorang perawat lansia (caregiver) atau asisten rumah tangga yang menginap (1 orang ARTL)?","a":"Tidak eligible sebagai responden SPKRT karena tidak ada dari ARTE itu yang bekerja","p":"","s":"innas","t":["sampel","art"]},{"q":"Bagaimana jika sampel terpilih pada bulan kedua tidak eligble lagi, misal jumlah art kurang dari dua, atau art yang bekerja pindah lokasi pekerjaan diluar kabupaten/kota, apakah harus diganti atau seperti apa?","a":"Dapat menggunakan sampel penganti.","p":"","s":"innas","t":["sampel","art"]},{"q":"Pencacahan di bulan ketiga pergantian triwulan, akan diambil kembali di tanggal 1 bulan keempat. Di saat bersamaan, petugas mencacah TW II di RT lainnya. Apakah petugas mendatangi 10 RT di SLS lama, 10 RT di SLS baru di tanggal yang sama, untuk kuesioner BLp?","a":"Betul","p":"","s":"innas","t":["sampel","bl"]},{"q":"Kesulitan jika jaraknya jauh. Apakah bisa jika tidak memungkinkan, menyerahkan di tanggal 2 atau 3","a":"Tidak apa-apa jika seperti itu, dan di recall di tanggal 1","p":"","s":"innas","t":[]},{"q":"Berarti anak kuliah tidak termasuk anggota rumah tangga?","a":"Betul tidak termasuk","p":"","s":"innas","t":["art"]},{"q":"Misal KRT yang sebagai pelaut, pulang 6 bulan sekali apakah masih dianggap ART?","a":"untuk kepala rumah tangga mirip dengan konsep susenas, dimana jika setahun tidak pulang, maka baru tidak dianggap art.","p":"","s":"innas","t":["art"]},{"q":"Apakah dilakukan imputasi jika pengeluaran tidak di-support untuk rumah tangga? Misalnya boarding school atau asrama dari pemerintah, seperti konsep susenas?","a":"Jika bantuannya dari pemerintah, tidak dicatat. Jika dari yayasan, maka pending.\nJika pembayaran bulanan, maka perlu diestimasi hariannya/dibagi.","p":"","s":"innas","t":["bl","hr","adm"]},{"q":"Apakah bisa mengisikan dengan Rp0?\n\nMisal pulang 2 hari sekali apakah dianggap ART?","a":"Terkait ruleval tidak akan terlalu ketat.\n\nTidak ada batas yang jelas, namun jika berniat menetap dapat dianggap ART. Untuk tiga belas tahun ke atas, maka dibatasi seminggu.","p":"","s":"innas","t":["art"]},{"q":"Jika ada ralat harap diupdate di buku pedoman hal 15","a":"untuk kepala rumah tangga mirip dengan konsep susenas, dimana jika setahun tidak pulang, maka baru tidak dianggap art.","p":"","s":"innas","t":["art"]},{"q":"Akan sulit untuk mendapatkan pengeluaran KRT yang jarang di rumah","a":"Dapat dilakukan dengan probing anggota keluarga lain, dan memang sulit","p":"","s":"innas","t":["bl","art"]},{"q":"Ijin bertanya di chat, memastikan KRT maksimal 1 tahun sekali masih dianggap sebagai KRT di tempat tinggal asalnya.\nKalau untuk ART, selain yang sekolah SMA ke Bawah, batasan sebagai ART dia harus pulang maksimal berapa hari sekali? seminggu, sebulan?","a":"Seminggu","p":"Kalau ART pulang setiap hari, walaupun bekerja/Kuliah diluar Kota maka masih termasuk ART di ruta tsb. Selain itu sudah bukan ART lagi","s":"innas","t":["art"]},{"q":"Untuk babysitter apakah definisi sama seperti HK (harus menerima pelatihan)","a":"Konsep sama seperti HK. Jika tidak ada pelatihan, maka masuk sebagai ART.","p":"","s":"innas","t":["art"]},{"q":"Seorang KRT di Kabupaten Lampung Selatan bekerja di pertambangan Kalimantan dengan sistem kerja on-off (tinggal di mess perusahaan selama 3 bulan dan hanya pulang 2 minggu sekali). Selama 3 bulan periode pencacahan, ia melakukan transaksi konsumsi sehari-hari (makan di restoran, membeli pakaian, cukur rambut, transportasi) di lokasi kerja luar pulau.\nSecara operasional kuesioner, KRT tersebut tidak berada di tempat tinggal sampel untuk mengisi kuesioner harian (HRp) maupun kuesioner bulanan (BLp), sementara pasangannya di rumah tidak mengetahui rincian konsumsi riil suaminya di rantau.\nmemasukkan konsumsi barang/jasa yang diakuisisi dan dikonsumsi di Kalimantan ke dalam kuesioner Kabupaten Lampung Selatan akan mengontaminasi struktur diagram timbang IHK Lampung Selatan dengan pola harga dan preferensi pasar wilayah lain.\n\nBagaimana perlakuan batas teritorialitas atas pengeluaran konsumsi ARTE yang sedang bepergian sementara di luar daerah selama periode survei: apakah pengeluaran konsumsi yang terjadi di luar kabupaten/kota sampel tetap harus direkam ke dalam dokumen BL dan HR rumah tangga asal? Jika ya, instrumen apa yang menjamin akurasi data konsumsi ARTE tersebut di tengah ketiadaan fisik responden di rumah tangga, dan bukankah hal ini mendistorsi representasi diagram timbang IHK lokal kabupaten setempat?","a":"Sesuai konsep yang ada di buku pedoman masuk sebagai ARTE","p":"","s":"innas","t":["sampel","bl","hr","art"]},{"q":"jika pembelian dilakukan dengan penukaran poin (baik CC maupun lainnya) apakah dilakukan pencatatan pengeluaran konsumsi? contoh pembelian tiket pesawat, pembelian kopi, dll","a":"Tetap dicatat pengeluaran konsumsi. Pembelian tunai. Di balancing di pendapatan S Blok VIII.3","p":"","s":"innas","t":["bl","s"]},{"q":"Tukar member swalayan termasuk pembayaran Kode apa?\n\nJika \"pembelian\" atau perolehan barangnya dari penukaran poin, maka untuk cara perolehan masuk ke kode apa? Apakah dilakukan pencatatan pengeluaran konsumsi?","a":"Tetap dicatat pengeluaran konsumsi. Pembelian tunai. Di balancing di pendapatan S Blok VIII.3","p":"","s":"innas","t":["bl","s","adm"]},{"q":"Apakah ada batasan yang jelas (fix) antara supermarket (pasar modern) dengan minimarket? Karena di Sumbar banyak \"market\" tapi ukuran luasnya tidak sebesar supermarket/hypermarket tapi lebih besar daripada indomart atau alfamart.","a":"Pasar Modern, karena komoditasnya lengkap/komplit. Bisa menggunakan 2 kuesioner HK.","p":"","s":"innas","t":["bl"]},{"q":"Memastikan untuk kode komoditas 1211058 \"Top Up Dompet Digital dan Uang Elektronik\", berarti pencatatan dikhususkan untuk yang tujuannya menabung saja ya?","a":"Iya","p":"","s":"innas","t":["bl"]},{"q":"Penulisan P dimana?","a":"Di kolom harga, sebagai simbol","p":"","s":"innas","t":[]},{"q":"Di buku pedoman di kolom 6, apakah P yang sama? Ada di halaman-halaman lain kolom 5, tidak sinkron","a":"Seharusnya di kolom harga","p":"","s":"innas","t":[]},{"q":"Jika pembelian melalui ke instagram pribadi dan jastip masuk ke jenis pasar mana?","a":"Outlet/Toko Khusus","p":"","s":"innas","t":["bl"]},{"q":"Pajak dari makanan jadi, pajak restoran itu masuk ke Bl berarti dan yang dituliskan di Hr hanya yang makanan saja tanpa masukkan nilai pajak nya?","a":"Pengeluaran konsumsi makanan yang ditulis oleh rumah tangga dicatat di HR, sedangkan ongkos kirim, biaya administrasi, pajak, dll dicatat di BL nanti pengawas yang akan mengisi kode apakah itu komoditas konsumsi atau bukan konsumsi, dengan catatan Jika responden bisa memisahkannya atau merinci detail pengeluarannya","p":"","s":"innas","t":["bl","hr"]},{"q":"Bagaimana penghitungan bobot? Diharapkan didapatkan esensinya bukan hanya harganya.","a":"Jika yang dimaksud adalah bobot komoditas, maka penghitungannya adalah pengeluaran setiap komoditas barang dan jasa dibandingkan dengan pengeluaran secara keseluruhan per orang secara rata-rata. Untuk memperoleh nilai pengeluaran langsung diperoleh dari responden, harga per komoditas sebagai kontrol.","p":"","s":"innas","t":["bl"]},{"q":"Pemberian makan ke ART apakah masuk BL?","a":"Masuk di HR.","p":"","s":"innas","t":["bl","hr","art"]},{"q":"Misalnya ART membeli somay dengan gajinya sendiri, maka apakah masuk HR?","a":"Tidak","p":"","s":"innas","t":["hr","art"]},{"q":"Apakah dokumen KK dikumpulkan ke Kabupaten?\n\nBagaimana jika responden tidak mengisi secara mandiri? Sehingga petugas harus melakukan probing recall. Apakah bisa HRp atau BLp dikembalikan dalam keadaan kosong ke kabupaten?","a":"Tidak perlu. Dipegang PML saja\n\nMemungkinkan. Namun untuk BL dan HR harus ada isiannya, dan administrasi seharusnya mengikuti pedoman.\n\nJika memang kosong, pencacah menanyakan kepada responden kenapa kosong sehingga ada keterangan catatan","p":"","s":"innas","t":["bl","hr"]},{"q":"Terkait barang yang diberikan, di BL misal majikan memberi barang ke pembantu, dicatat dengan kode 5 pemberian, kode 12 pengeluaran/konsumsi. Namun untuk di HR, dijadikan pengeluaran konsumsi. Makanan jika diberikan ke orang lain, pengeluaran konsumsi. Namun di BL, jadi pengeluaran nonkonsumsi.","a":"Semua pemberian baik makanan atau nonmakanan yang diberikan kepada orang lain tidak termasuk konsumsi rumah tangga. Di BL, jika rumah tangga memberi barang kemudian diberikan kepada pihak lain, maka kode 5. Jika di HR, masuk ke lainnya. Jika diberikan kepada pembantu, masuk konsumsi. Karena di sistem pengolahan akan dihitung. \nKemudian akan dipecah di S, jika ada ARTL.\nUntuk makanan konsumsi untuk ARTL tidak dapat dipisahkan, namun akan dipisah dalam bentuk upah di pengolahan.","p":"","s":"innas","t":["bl","hr","art"]},{"q":"Hajatan apakah tidak dimasukkan?","a":"Tidak udah di HR. BL diberikan ke orang lain dicatat, namun di HR tidak dicatat, hanya konsumsi riil","p":"","s":"innas","t":["bl","hr"]},{"q":"Pemberian makanan ke orang lain itu dicatat di mana?","a":"Bisa di BL, ada konsumsi pesta.","p":"","s":"innas","t":["bl"]},{"q":"Jika esensinya yang dikonsumsi oleh ARTE dicatat, sedangkan anak sekolah yang tidak tinggal di situ akan kesulitan mendapatkan informasi","a":"Untuk kasus seperti itu, rumah tangga dapat memperkirakan dengan menanyakan kepada anak tersebut.","p":"","s":"innas","t":["bl","art"]},{"q":"Penerimaan MBG tidak dimasukkan?","a":"Ya, jangan dimasukkan karena merupakan bantuan pemerintah ke rumah tangga. Kalau dari perusahaan, tetap dicatat","p":"","s":"innas","t":[]},{"q":"Jika konsumsi ARTL yang dapat dipisahkan tidak dimasukkan, apakah tidak menjadi pengurang konsumsi ARTE?","a":"Ya dicatat","p":"","s":"innas","t":["bl","art"]},{"q":"Jika mendapat bantuan beras, maka konsumsi beras bisa tidak dicatat?","a":"Untuk sampel diusahakan bukan penerima bantuan","p":"","s":"innas","t":["sampel","bl"]},{"q":"Tetapi kalau bantuan hunian tetap apakah tetap diimputasi?","a":"Ya, khusus rumah dicatat perkiraan sewa bulanannya. Tetapi makanan t
