idak.","p":"","s":"innas","t":[]},{"q":"Misal ARTL diberikan makanan jadi tetap dicata. Misalnya sedang membangun rumah, kemudian menyeduhkan kopi ke tukang, membuat makanan. Apakah memasak ke luar ART tetap diproporsikan?","a":"Tidak karena tukang bukan ARTL","p":"","s":"innas","t":["art"]},{"q":"Jika ada sampel pengganti di bulan ketiga, maka BL bulan 1 dan 2 apakah diisi juga? Kemudian untuk isian S, berarti wawancara, namun untuk BL 1 dan BL 2 diisi juga atau S saja?","a":"sesuai di buku pedoman pergantian sampel pada bulan ketiga, dimana BL bulan ke 1 dan ke 2 di recall (ditanyakan langsung dengan wawancara) kepada rumah tangga pengganti dengan menggunakan kuesioner S. Sedangkan BL bulan ke 3 ditinggal untuk diisi oleh responden pengganti. Jika pergantian sampel di akhir bulan ke tiga bisa dilihat dan dibaca di buku pedoman","p":"","s":"innas","t":["sampel","bl","s"]},{"q":"PNS cuti lebih dari 3 bulan apakah tidak bekerja?","a":"Tetap dikategorikan sebagai pekerja","p":"","s":"innas","t":[]},{"q":"Mertua pergi ke ruah anaknya. Bukan ARTE. Apakah masuk ARTL? Pergi lama misalnya 6 bulan","a":"Tidak perlu dicatat. Bukan ART. Sebisa mungkin jika bisa dipisah, maka dipisahkan.\nTambahkan catatan di HR jika tidak bisa dipisah","p":"","s":"innas","t":["hr","art"]},{"q":"Bukped halaman 67, bekerja selama sejam kumulatif atau tidak terputus 1 minggu. Sedangkan pembuat konten kumulatifnya lepas. Jadi apakah kumulatif atau tidak?","a":"Kumulatif maupun tidak terputus diperbolehkan","p":"","s":"innas","t":[]},{"q":"Tanah dialasi karpet plastik masuk ke nomor berapa untuk jenis lantai?","a":"Tanah","p":"","s":"innas","t":[]},{"q":"Misalkan bangunan bercampur dengan toko, untuk bangunan campuran apakah dilihat yang tempat tinggal saja atau secara keseluruhan?","a":"Terluas dilihat dari bangunan keseluruhan.\nnote: tidak ada penjelasan di buku pedoman","p":"","s":"innas","t":[]},{"q":"Dalam suatu desa untuk memenuhi kebutuhan air, diorganisir dengan menampung air sungai di suatu tempat lalu disalurkan dengan pipa ke rumah-rumah warga. Warga membayar rutin bulanan Rp.20 ribu (baik airnya dipakai maupun tidak, atau dipakai sedikit maupun banyak). Cara perolehan airnya apakah membeli atau langganan?","a":"Membeli","p":"","s":"innas","t":["bl"]},{"q":"Membedakan membeli dan langganan air","a":"Langganan, ada abonemen (uang untuk berlangganan)","p":"","s":"innas","t":[]},{"q":"Misalnya hanya menggunakan air PDAM untuk memasak. memungkinkan BL ada pengeluaran untuk air, namun HR tidak ada pembelian air, hanya pembayaran tagihan PDAM memungkinkan?","a":"Ya, memungkinkan","p":"","s":"innas","t":["bl","hr","adm"]},{"q":"Apakah data SKPRT berpengaruh di DTSEN?","a":"Tidak","p":"","s":"innas","t":[]},{"q":"Misalkan ada dua rumah tangga, keduanya merupakan sampel SPKRT. Ruta A menggadaikan sepeda motornya ke Ruta B. Berarti di ruta A tidak menguasai sepeda motor, sedangkan ruta B menguasai sepeda motor","a":"Ya","p":"","s":"innas","t":["sampel","art"]},{"q":"Misalkan langganan internet telkom kemudian mendapat langganan TV berbayar secara gratis, itu bagaimana?","a":"Berarti dia memiliki akses ke internet dan TV berbayar","p":"","s":"innas","t":[]},{"q":"Bagaimana esensi dari incian 12 ini?","a":"Terdapat check and recheck. biasanya kepemilikan mobil atau motor, akan ada pengeluaran, misalnya bensin.","p":"","s":"innas","t":["bl"]},{"q":"misalkan satu rumah ada dua rumah tangga, rumah tangga A dan rumah tangga B. listrik dan wifi dibayarkan oleh rumah tangga A tp dipakai besama dengan rumah tangga B. Jika B jadi sampel, apakah pengeluaran diproporsikan?","a":"Ini dianggap sebagai pemberian dari pihak lain, tetap dicatat nilai pengeluarannya diproporsikan terhadap jumlah orang yang menikmati fasilitas tersebut","p":"","s":"innas","t":["sampel","bl"]},{"q":"Pembatasan 6 jam menghilangkan kegiatan rekreasi","a":"6 jam dari konsep susenas.","p":"","s":"innas","t":[]},{"q":"Perjadin tidak tercakup, apakah employee gathering tercakup?","a":"Dicatat karena bukan pemerintah. Misalnya BUMN jika dibiayai pemerintah maka juga tidak dicatat","p":"","s":"innas","t":[]},{"q":"Apakah minimarket itu selain konsepnya pelayanan mandiri, ada syarat transaksi pembayaran menggunakan barcode?\nDi daerah banyak toko eceran menjual berbagai kebutuhan, tidak hanya makanan, dg sistem mandiri tapi transaksi kasir masih manual.\nApakah dikategorikan outlet atau minimarket?","a":"minimarket itu pasar modern yang ukurannya pasarnya lebih kecil, komoditas yang diperjual belikan juga lebih sedikit. Syarat pengambilan barangnya mandiri, dan ada scan barcode harga barang. Sebagai contoh adalah alpamart dan indomart","p":"","s":"innas","t":["bl","adm"]},{"q":"konsep minimarket berarti berbeda ya dengan SHK? di SHK minimarket dikategorikan outlet","a":"Bukan berbeda tetapi berusaha merincikan detail yang dulu masuk di outlet dan di pasar tradisional secara gelondongan, sekarang bisa mengetahui sumber pembelian barang dan jasa yang lebih detail.","p":"","s":"innas","t":[]},{"q":"Untuk cara perolehan kode 6 Lainnya, jenis pasar apa?","a":"1. Tradisional","p":"","s":"innas","t":["bl"]},{"q":"Di slide BL, untuk kasus responden tidak tahu jenis pasar, diberikan kode satu, sedangkan di buku tiga diberikan kode tiga","a":"Jika responden tidak mengetahui jenis pasar tempat barang/jasa diperoleh , maka diisikan kode 1 (Pasar Tradisional). Apabila suatu wilayah diketahui tidak memiliki pasar tradisional, jenis pasar dicatat kode 3 (outlet).","p":"","s":"innas","t":["bl"]},{"q":"1. Ramayana di dalam mall masuk outlet\n2. Apakah toko-toko di dalam mall masuk outlet?","a":"1. Ya\n2. Ya, kecuali misalnya hypermart masuk pasar modern","p":"","s":"innas","t":[]},{"q":"Untuk ramayana yang menjual grosiran juga, apakah masuk pasar modern?","a":"Ya, jika masuk kesatuan seperti itu","p":"","s":"innas","t":[]},{"q":"Bagaimana membedakan tujuan investasi dan perhiasan untuk emas?","a":"Berdasarkan pengakuan responden","p":"","s":"innas","t":[]},{"q":"Dibedakan antara kode emas untuk perhiasan dan investasi","a":"Ada kode \"emas perhiasan untuk investasi\"","p":"","s":"innas","t":[]},{"q":"1. Untuk pembayaran premi tetap masuk di pengeluaran bukan konsumsi?\n3. Klaim asuransi, bagaimana menuliskan rinciannya?\n4. Di blok 8, selama periode survei/3 bulan. Kondisi ART sesuai saat dicacah, ada kemungkinan berbeda dengan BL. Bila di 1 ruta hanya ada 1 ARTE yang bekerja, namun dia pindah, apakah pendapatannya menjadi kosong?","a":"1. Ya, masuk\n3. Dituliskan gelondongan\n4. Tidak mungkin pendapatan kosng jika ada pengeluaran. Bisa dari tabungan","p":"","s":"innas","t":["bl","s","adm","art"]},{"q":"Untuk BPJS Ketenagakerjaan apakah masuk pengeluaran?","a":"Tidak perlu dicatat","p":"","s":"innas","t":["bl"]},{"q":"Untuk ARTE yang di bulan ketiga keluar, apakah dicatat 2 bulan atau tidak dimasukkan sama sekali?","a":"2 bulan. Untuk bulan ketiga dapat dimasukkan dalam bentuk transfer","p":"","s":"innas","t":["art"]},{"q":"Untuk nama ARTE yang keluar, di kolom 2 apakah tetap dimasukkan?\n\nUntuk blok 4 apakah dimasukkan?","a":"Ya, nama tetap tertulis\n\n\nDicatat saja, apalagi merupakan sumber penghasilan","p":"","s":"innas","t":["art"]},{"q":"HR di bulan ketiga, nanti yang pindah tidak tercatat makan minumnya","a":"Benar karena bukan anggota rumah tangga lagi","p":"","s":"innas","t":["hr","art"]},{"q":"Syarat minimal dua anggota rumah tangga. Namun jika di tengah ada kejadian meninggal atau pindah, apakah masih dilanjutkan?","a":"Ya dilanjutkan, dati dua berkurang satu jadi masih 1, lanjutkan saja, tidak perlu ganti sampel","p":"","s":"innas","t":["sampel","art"]},{"q":"Ada perbedaan kode di slide dan buku pedoman","a":"Untuk nama komoditas sama, mungkin ada kode komoditas yang belum diupdate. Nanti mengikuti kode terbaru.","p":"","s":"innas","t":["bl"]},{"q":"Untuk ganti sampel, misal di bulan kedua atau ketiga, untuk sampel utama di bulan pertama apakah dibayarkan?","a":"Tetap dihitung dan dibayarkan, dari anggaran operasional/translok. Untuk BL tetap diperhitungkan, jika ada recall tergantung pimpinan daerah, apakah diberikan dari anggaran operasional/translok.","p":"","s":"innas","t":["sampel","bl","adm"]},{"q":"Untuk pendapatan di S blok 9 dan 8, sifatnya legal? Untuk undercover economy seperti perjuian, tukang parkir ilegal apaka termasuk?\n\nAsuransi sifat seperti BPJS, kemudian mendapat cairan ginjal/kiriman obat. Apakah dicatat?","a":"Sepengakuan responden. Boleh masuk. Secara umum, SPKRT mencatat seluruh pendapatan yang didapatkan tanpa melihat legalitas.\n\nKlaim tersebut tidak perlu diinput sebagai pengeluaran, masuk sebagai pengeluaran pemerintah. Kecuali bukan asuransi pemerintah, maka perlu dicatat","p":"","s":"innas","t":["bl","s","art"]},{"q":"Diberikan titik-titik jika ada kualitas baru. Di aplikasi apakah mengusulkan kualitas baru. Untuk dulu memakai foto untuk mengajukan kualitas baru, apakah masih seperti itu?\n\nTeman-teman daerah mengalami kesulitan jika foto barang tidak ada di google.","a":"Untuk foto belum ada info, tetapi akan ada pengajuan melalui webentry.","p":"","s":"innas","t":["app"]},{"q":"Pengeluaran rawat inap dan rawat jalan yang dibiayai oleh asuransi swasta (lansung dibayarkan perusahaan asuransi ke rumah sakit), apakah dicatat? Jika dicatat nantinya akan di balancing di blok VIII.3 no 08 ya?\n\nKalau slide contoh Pak Dody itu maksudnya biaya perawatan yang dibayar oleh perusahaan tempat Pak Dody bekerja kan ya? atau dibayarkan oleh persuahaan asuransi swasta?","a":"pengeluaran untuk biaya kesehatan dibayarkan oleh asuransi (SWASTA) atau klaim tetap dicatat sebagai pengeluaran, jika bisa dirinci oleh responden lebih baik lagi. Pendapatan sebagai balancing, dicatat di kuesioner S blok VIII.3 rincian 8. \nPengeluaran baik dari perusahaan swasta atau asuransi swasta untuk biaya kesehatan pegawainya yang menjadi sampel SPKRT saat klaim tetap dicatat sebagai pengeluaran rumah tangga pegawainya.","p":"","s":"innas","t":["sampel","bl","s","art"]},{"q":"Pertanyaa V.12. Art menguasai layanan digital berbayar dari kantor (PNS), maka diisi 1 ya? Namun untuk pengeluaran biaya langganan tidak dicatat?","a":"Jika yang dimaksud adalah lisensi office 365 atau adobe yang dibayar kantor Pemerintahan (PNS) untuk laptop kantor, maka dianggap tidak ada layanan digital berbayar. Karena asumsinya digunakan hanya untuk keperluan dan pekerjaan kantor saja.","p":"","s":"innas","t":["bl","art"]},{"q":"Untuk kuesioner Bl, di pdfnya baru 5 halaman, untuk di kabupaten cetaknya berapa halaman?\n\nUntuk spesifikasi cetak apakah diberikan?","a":"4 lembar untuk blok 5\n\n\nYa, untuk contoh akan disiapkan.","p":"","s":"innas","t":["bl"]},{"q":"Misal bulan 1 & 2 ada lewat cacah misalnya les anak, untuk BL bulan ketiga bagaimana?","a":"Nanti bulan ketiga cukup bulan ketiga saja, bulan 1 dan 2 di S.","p":"","s":"innas","t":["bl"]},{"q":"Terkait hadiah, mis baju apakah ditulis baju atau pengiriman hadiah sumbangan?","a":"Lebih baik didetailkan. Disebutkan saja nama barangnya","p":"","s":"innas","t":[]},{"q":"Penambahan informasi untuk responden yang memiliki hewan peliharaan","a":"Saran ditampung dan akan didiskusikan kembali","p":"","s":"innas","t":[]},{"q":"Bagaimana dengan diskrepansi pendapatan dan pengeluaran?","a":"Belum ditetapkan, namun kemungkinan mengikuti SBH sebelumnya yaitu 20%, jika melebihi kemungkinan akan ada rule validasi di web entry.","p":"","s":"innas","t":["bl","s"]},{"q":"Misalnya rumah tangga belum kembali dari mudik, apakah bisa diganti atau di-recall","a":"Tadinya 2-3-3-2, karena adanya jadwal baru, disarankan menjadi 2-2-3-3.\nDi luar ini, mengikuti buku pedoman. Sebenarnya tidak ada peraturan kaku, diserahkan kepada pengawas bagaimana yang efektif dan efisien di lapangan","p":"","s":"innas","t":["jadwal"]},{"q":"Ada kalender pencacahan untuk petugas?","a":"Akan dibuatkan","p":"","s":"innas","t":["jadwal"]},{"q":"Untuk voucher misalnya voucher MAP, apakah masuk ke dalam pendapatan?","a":"Jika BUMN, maka masuk saja","p":"","s":"innas","t":["s"]},{"q":"Top-up e-wallet kapan masuk di pengeluaran?","a":"Bisa dimasukkan/dicatat (BL), tetapi bukan untuk pengeluaran konsumsi, dan tidak termasuk dalam penghitungan diagram timbang.","p":"","s":"innas","t":["bl"]},{"q":"Bagaimana dengan e-toll","a":"Sama dengan dopet digital, yaitu saat tap e-toll baru dihitung pengeluaran. Tidak seperti kartu FunWorld yang dihitug ketika top-up","p":"","s":"innas","t":["bl"]},{"q":"Jika ada komoditas di BL yang seharusnya tidak masuk konsumsi, apakah dicoret di BL?","a":"Dibiarkan, namun pengawas harus menulis kode 12","p":"","s":"innas","t":["bl"]},{"q":"Untuk Whatsapp bisnis masuk WA atau marketplace?","a":"Masih WA, karena belum bisa transaksi","p":"","s":"innas","t":[]},{"q":"Misalnya transaksi di tokped, kemudian ambil ke outlet langsung. Itu masuk transaksi dimana?","a":"Masih termasuk online shop, karena pembayaran di tiktok, namun tiak menggunakan jasa pengiriman","p":"","s":"innas","t":["adm"]},{"q":"Pada materi penjelasan umum, alur Kunjungan HR, pada kunjungan ke-2 (Kamis) poin ke-3, \"Wawancara VPKRT27-S blok VI dan VII untuk komoditas yang tidak ada tanda cek. Pemberian tanda cek ....\".\n\nApakah pemberian tanda cek ini harus dilakukan, apakah ada ketentuan cara pemberian tanda? karena di dokumen S tidak ada kolom khusus untuk memberi tanda.\n\nAtau petugas diperkenankan cukup konfirmasi komoditas yang belum ada isiannya saja? tanpa memberi tanda cek","a":"Ketentuan pemberian tanda cek dapat dilihat di buku pedoman untuk prosedur pengisian Blok VI dan Blok VII. Pemberian tanda cek dilakukan di kolom (3) rata kanan setiap blok VI dan blok VII.\n\nPemberian tanda cek tetap perlu dilakukan sebagai sebagai alat kontrol untuk memastikan kelengkapan pencatatan pengeluaran triwulanan, khususnya dalam mengidentifikasi komoditas yang belum tercatat, dan juga membantu petugas melakukan cross-check terhadap isian pada kuesioner pendukung lainnya, sehingga meminimalkan risiko komoditas terlewat serta menjaga konsistensi dan kelengkapan isian.","p":"","s":"innas","t":["sampel","bl","hr","s","art"]},{"q":"Mohon kode jenis barang/jasa bisa dibagikan juga dalam bentuk file excel","a":"Untuk master komoditas selain disediakan dalam bentuk buku 5, juga nanti akan ada versi aplikasi android. Aplikasi tersebut dapat didownload di playstore untuk mencari kode komoditas maupun kode kualitas.","p":"","s":"innas","t":["bl","app"]},{"q":"Apakah ada soft file atau link pengisian BL, BLp, HR dan HRp secara online untuk memfasilitasi responden yang mau mengisi tapi tidak mau menulis?\n\nkalau bisa mhn difasilitasi untuk menghindari pengeluaran yg tidak tercatat, terutama BLp dan HRp untuk ARTE yg tidak tinggal di rumah, misal anak yg mondok dan KRT yg LDR","a":"Sejauh ini belum ada disiapkan mekanisme pengisian kuesioner secara online. Pertanyaan dan sarannya akan kami disuksikan lebih lanjut.","p":"","s":"innas","t":["bl","hr","art"]},{"q":"Menyambung Pak Yana, kalau bisa, selain file excel, ada semacam aplikasi untuk memudahkan petugas dalam melakukan pencarian kode komoditas","a":"Untuk master komoditas selain disediakan dalam bentuk buku 5, juga nanti akan ada versi aplikasi android. Aplikasi tersebut dapat didownload di playstore untuk mencari kode komoditas maupun kode kualitas","p":"","s":"innas","t":["bl","app"]},{"q":"Usul: untuk petunjuk pengisian di kuesioner BL pada pengeluaran konsumsi pakaian dan alas kaki, mohon contoh penulisan komoditasnya ada detil pria/wanita/anak karena nantinya penulisan kode komoditasnya berbeda2 untuk pakaian pria/wanita/anak (agar responden atau petugas lebih aware dan detil dalam pengisiannya)","a":"Baik, terima kasih atas masukannya","p":"","s":"innas","t":["bl"]},{"q":"Pengeluaran terbagi menjadi pengeluaran konsumsi dan non konsumsi. Apakah ada analisis lanjutan untuk pengeluaran non konsumsi, karena yang digunakan nanti sebagai dasar diagram timbang adalah pengeluaran konsumsi. Apakah tidak sebaiknya kita fokus saja pada isian pengeluaran konsumsi rumah tangga?","a":"Tujuan SPKRT adalah mencacat konsumsi rumah tangga dengan hasil akhir adalah diagram timbang. Namun, pertimbangan dilakukan pencatatan pengeluaran non konsumsi adalah untuk tujuan diskrepansi terkait dengan pendapatan dan pengeluaran.","p":"","s":"innas","t":["bl","s","art"]},{"q":"Bagaimana pengeluaran untuk rumah tangga yang membeli bensin selain untuk konsumsi rumah tangga juga untuk usaha?","a":"Perlu dilakukan proporsi untuk memisahkan pengeluaran untuk konsumsi ruta dan pengeluaran untuk usaha. Jika sulit dipisahkan dapat dicatatkan untuk pengeluaran paling dominan, tetapi diusahakan dapat dipisahkan.","p":"","s":"innas","t":["bl"]},{"q":"Untuk pembelian tiket hotel yang kemudian dilakukan refund, tetapi tidak full bagaimana pencatatannya?\n\nPembelian mas perhiasan, apakah berdasarkan niatnya apakah untuk investasi atau sebagai perhiasan?","a":"Jika refund tidak full, maka biaya yang dikeluarkan dari pembayaran yang tidak dikembalikan akan masuk ke pengeluaran non konsumsi\n\nUntuk emas tergantung niatnya, misalkan niatnya untuk investasi berarti masuk pengeluaran bukan konsumsi.\nUntuk kasus tas lebih masuk ke konsumsi, kecuali memang benar-benar tujuannya dijual kembali","p":"","s":"innas","t":["bl","adm"]},{"q":"Bagaimana jika biaya hotel hangus karena tidak ditempati?\n\nBerapa lama waktu yang digunakan untuk pertimbangan penggantian sampel?","a":"Tetap dicatat sebagai pengeluaran konsumsi hotel, tidak peduli digunakan atau tidak karena terdapat hak untuk menggunakan jasa tersebut\n\nPencacahan pada saat hari raya dilakukan","p":"","s":"innas","t":["sampel","bl"]},{"q":"Bagaimana pencatatan untuk pengeluaran pendaftaran umroh ataupun haji yang tidak langsung dinikmati jasanya? Misal pada Januari 2027, dikeluarkan 30 juta untuk umroh di bulan Ramadhan (Februari) dan pada bulan Februari dikeluarkan 25 juta untuk membayar porsi pendaftaran haji.","a":"Untuk jasa, pengeluaran dicatat pada saat hak atas jasa tersebut berlaku dan pelaksanaannya jatuh pada periode pencacahan. jika pelaksanaan umroh/haji berada di luar periode pencacahan maka tidak perlu dicatat.","p":"","s":"innas","t":["bl","jadwal"]},{"q":"Pada buku pedoman disebutkan: \"Biaya yang tidak rutin dikeluarkan setiap bulan, seperti biaya pendidikan perguruan tinggi, uang gedung, uang komite sekolah, pajak kendaraan, Pajak Bumi dan Bangunan (PBB), dan pengeluaran sejenis lainnya tetap dicatat pada bulan saat pengeluaran tersebut dibayarkan oleh rumah tangga\". Berarti untuk biaya pendaftaran SD yang inden, misalkan dibayarkan di bulan Januari-Maret 2027 tetap dicatat oleh ruta sampel TW 1 meskipun jasa pendidikan SD baru diperoleh di Juli 2027 ya? (kalau iya, jadi agak berbeda dengan konsep akuisisi jasa yang lain, yang dicatat ketika jasanya diterima)","a":"Betul, dicatat pada periode dibayarkan. Memang berbeda dengan konsep akuisisi jasa lain, karena ini merupakan kasus khusus.","p":"","s":"innas","t":["sampel","bl"]},{"q":"Misalkan orang tua yang sedang menginap di rumah anak pertama, apakah dicatat sebagai ARTE? Orang tua tersebut bergilir ke rumah anaknya\n\nUntuk pasangan belum menikah tetapi 1 rumah, bagaimana apakah masuk kategori RUTA?\n\nUntuk tukang kebun, apakah masuk ART atau lainnya?","a":"Perlu ditanyakan apakah orang tersebut menetap? Jika tidak menetap maka bukan merupakan ART karena tidak memenuhi syarat tinggal minimal 1 tahun maupun berniat menetap\n\nMasih dikonfirmasi untuk pertanyaan 2\n\nTukang kebun yang menginap masuk sebagai ARTL (Kode 5), jika tidak menginap bukan ART","p":"","s":"innas","t":["art"]},{"q":"1. konsekuensi pas pemutakhiran ditulis banyaknya pengelolaan dapur, itu kemana sih? (yang contoh orang tua numpang sama anaknya) jadi dia sudah pasti akan masuk ke ruta anaknya gak? 2. batas ARTE dan ARTL masih belum jelas nih, jadi ARTL khusus art menginap gitu? kalau kasus anak indekost dengan makan?","a":"1. pengelolaan dapur pada saat pemutakhiran dimaksudkan untuk menentukan rumah tangga eligible. akan tetapi, untuk pencatatan pengeluaran, perlu diidentifikasi kembali apakah semua anggota rumah tangga termasuk ke ARTE atau tidak\n\n2. ARTL adalah anggota rumah tangga yang menginap dan memiliki ikatan kerja dengan KRT, atau hubungan membayar dan dibayar. untuk anak indekos termasuk ARTL","p":"","s":"innas","t":["sampel","bl","art"]},{"q":"Mohon diberikan penjelasan yang mudah dipahami untuk petugas terkait pencatatan diskon, subsidi ongkir, dan bonus pembelian.\n1. Harga barang diskon yang dicatat adalah harga setelah diskon >> sesuai pengeluaran out of pocket, begitu pula dengan ongkos kirim. Jika ongkos kirim mendapat potongan harga dari platform, maka dituliskan harga setelah diskon. Jika setelah diskon, ongkir menjadi Rp 0 maka tidak dicatat (ini tidak apa-apa kah jadi hilang komoditas ongkos kirimnya? padahal jasanya diterima oleh rumah tangga).\n2. Bonus pembelian dicatat sebagai baris komoditas baru dengan cara perolehan pemberian dari pihak lain, termasuk jika membeli barang buy 1 get 1, atau dapat bonus barang ketika belanja maka dicatat sebagai pengeluaran konsumsi dan diperkirakan dengan harga pasar. Mohon dijelaskan perbedaannya dengan ongkos kirim, kenapa jasa ongkos kirim gratis tidak dicatat, tetapi barang bonus (gratisan) dicatat.","a":"1. Benar, untuk pengeluaran barang dan jasa yang mendapat diskon, nilai yang dicatat ialah nilai akhir setelah mendapat diskon/potongan harga. Jadi, untuk ongkir yang setelah potongan harga menjadi Rp 0, tidak perlu dicatat. \n2. Pada konsep yang digunakan dalam SPKRT, treatment untuk bonus pembelian/barang dan jasa yang gratis dan yang diperoleh selain dari pembelian berbeda dengan barang/jasa yang nilainya berkurang karena mendapat potongan harga/diskon. Jadi, untuk barang/jasa yang mendapat diskon/potongan dicatat nilai akhir setelah potongan harga, sedangkan untuk barang/jasa yang sifatnya gratis diperkirakan nilainya.","p":"","s":"innas","t":["bl","art"]},{"q":"Mohon penjelasan untuk biaya rawat inap yang ditanggung oleh asuransi perusahaan sebagaimana dijelaskan pada Buku Pedoman 3 halaman 105-106. Disebutkan bahwa biaya rawat inap yang ditanggung oleh perusahaan dicatat sebagai pengeluaran konsumsi rumah tangga, serta sebagai pendapatan rumah tangga (balancing). Apakah itu juga berlaku untuk asuransi BPJS kesehatan? Di buku pedoman hanya disebutkan bahwa iuran premi BPJS (baik ASN maupun mandiri) dicatat sebagai pengeluaran bukan konsumsi. \nJika rumah tangga berobat rawat jalan atau rawat inap menggunakan BPJS kesehatan apakah dicatat sebagai pengeluaran konsumsi dan pendapatan rumah tangga (analog dengan asuransi swasta)? \nAtau dilihat dulu jenis BPJS nya, jika BPJS PBI maka seluruh biaya dan konsumsi kesehatan tidak dicatat karena merupakan bagian dari pengeluaran pemerintah (bukan pengeluaran rumah tangga) analog dengan Kartu Indonesia Pintar di Buku Pedoman 2 halaman 55.","a":"Untuk klaim asuransi BPJS, pada SPKRT 2027, ini tidak dicatat dalam pengeluaran rumah tangga, baik untuk BPJS tenaga kerja, mandiri, maupun PBI. Hal ini selaras dengan konsep yang digunakan dalam penghitungan neraca nasional yang memperhitungkan klaim asuransi BPJS sebagai pengeluaran pemerintah (government spending).","p":"","s":"innas","t":["bl","s","art"]},{"q":"Jika responden berobat ke rumah sakit dengan menggunakan klaim asuransi dari perusahaan. Bagaimana penulisan rincian komoditasnya, karena responden tidak tahu biaya dokter, pemeriksaan lab, obat2an, dll","a":"Boleh ditanyakan ke responden terlebih dahulu apakah menerima receipt tagihan/daftar pengeluaran untuk yang diklaim oleh asuransi karena biasanya dari pihak asuransi menyediakan receipt ini. Jika tidak ada dan responden tidak bisa menguraikan pengeluarannya secara detail, dicatat di komoditas yang menurut responden paling besar pengeluarannya. Tapi, tetap diarahkan responden untuk berusaha merincikannya melalui perkiraan.","p":"","s":"innas","t":["bl","s"]},{"q":"Untuk pemberian barang bekas apakah dicatat sebagai konsumsi dengan kode pemberian?\nKoperasi Desa Merah Putih, apakah masuk ke dalam minimarket atau outlet/toko khusus?","a":"Pemberian barang bekas dicatat sebagai pengeluaran nonkonsumsi (kode 1211020001) dan kode perolehan 5.\nKDMP dikategorikan sebagai outlet.","p":"","s":"innas","t":["bl"]},{"q":"Cashback dalam transaksi biasanya berupa poin/coin yang dapat digunakan untuk transaksi/konsumsi selanjutnya.\n\nUntuk transaksi yang menggunakan poin/coin dari cashback, apakah konsumsinya tidak dicatat? atau tetap dicatat sebagai pengeluaran konsumsi dan jumlah cashbacknya nanti dituliskan di pendapatan pada kuesioner S agar neraca balance?","a":"Benar, nilai barang/jasa yang dibayarkan dengan menggunakan poin/coin tetap dicatat sebagai pengeluaran konsumsi. Lalu, besaran poin/coin yang digunakan untuk membayarkan barang/jasa tadi dicatat di kuesioner S, blok VIII.3","p":"","s":"innas","t":["bl","s"]},{"q":"Pada bahan ajar dan buku pedoman, penjelasan mengenai cara perolehan kode 4 pemberian dari pihak lain selain rumah tangga menyebutkan: \n\"pihak tersebut antara lain pemerintah, tempat ibadah, organisasi kemasyarakatan, LSM, partai politik, perusahaan, sekolah, atau lembaga lainnya.\"\nApabila pemberian dari pemerintah memang tidak dicakup, mohon untuk dapat disesuaikan kembali redaksi penjelasan untuk poin ini.","a":"Kami tampung dan akan diskusikan terlebih dahulu. Hasil keputusannya akan disampaikan nantinya di penegasan.","p":"","s":"innas","t":["bl"]},{"q":"Untuk pembelian barang lewat WA, Facebook, jenis pasarnya apa ya ?","a":"Jika pembelian melalui WA Business dan Facebook Marketplace, yang ada fitur click and buy, masuk ke jenis pasar online. Sementara itu, jika pembelian barang hanya melalui chat/pesan/telepon via WA atau Facebook disesuaikan kembali dengan asal barang tersebut diperoleh dari pasar apa.","p":"","s":"innas","t":["bl"]},{"q":"- Barang yang dibeli secara online tapi ternyata rusak atau tidak dikirim pecatatannya apakah seperti tiket yg hangus yaitu tetap dicatat sebagai pengeluaran konsumsi? Lalu bagaimana dengan kasus barang yang dikirim tidak sesuai pesanan? misal pesan tas yang datang sepatu, komoditasnya dicatat sesuai barang yg dipesan? atau dicatat sesuai sesuai barang yg datang?\n\n- Sekarang ini ada istilah sewa beli atau financial lease, misal driver gojek atau gocar dengan batasan setoran dan jam kerja tertentu dalam kurun waktu tertentu motor atau mobil itu menjadi milik driver, barang yg diperoleh dengan cara seperti ini pada periode survei apakah dicatat dalam BL? Jika ya, harga yg dicatat berarti harga pembelian tunainya? kl responden tidak tahu harga pembelian tunainya apakah diperkirakan dari hasil browsing? Kemudian cara perolehan dan jenis pasarnya kode berapa?\n\n- Pembelian langsung ke produsen, misal beli ikan langsung ke nelayan atau beli kerupuk langsung ke pabriknya, kode jenis pasarnya apakah lainnya?\n\n- Nilai konsumsi yang tidak bisa dipisahkan antara untuk ruta dan usaha, seperti bensin, pulsa, dll, bagaimana pencatatan harganya?\n\n- Pembelian barang bekas atau second apakah dicatat? bagaimana pencatatannya? misal membeli hp second, apakah jenis barangnya ditulis hp bekas? atau tetap ditulis hp saja dan dicatatan ditulis bekas?\n\n- Untuk barang yang diberikan ke pihal lain, misal responden menulis kemeja pria dan kolom 8 nya berkode 5, penulisan kode komoditasnya berarti menjadi kode 12 atau tetap kode 02?","a":"1. Jika barang yang rusak, tidak dikirim, atau salah kirim tersebut diajukan dan diterima refund/pengembalian dana oleh rumah tangga, maka tidak perlu dicatat.\n\n2. Untuk kasus seperti ini masuk ke dalam pengeluaran nonkonsumsi (Pembelian Alat untuk Usaha) karena tujuan penyewaan ialah untuk usaha ojek online. Untuk nilai yang dicatat ialah total setoran yang dibayarkan oleh rumah tangga sebagai biaya sewa. Untuk cara perolehan disesuaikan apakah dibayarkan tunai atau lunas, dan kode pasarnya dapat dituliskan kode 3 Outlet.\n\n3. Jenis pasarnya dikategorikan sebagai outlet, kecuali apabila produsennya tersebut melakukan perdagangan di wilayah pasar.\n\n4. Diperkirakan dan diproporsikan sesuai pengakuan dari responden.\n\n5. Selain itu, mobil, motor, dan sepeda, pencatatan pembelian barang bekas tetap ditulis sesuai komoditas dan kualitasnya. Misalnya, untuk handphone bekas tetap dicatat komoditasnya Handphone, dan kualitasnya sesuai dengan merk Handphone tersebut. Keterangan bahwa barang tersebut merupakan barang bekas dapat dituliskan di Blok Catatan.\n\n6. Benar, apabila barang tersebut diberikan ke pihak lain selain ART, dicatat sebagai pengeluaran nonkonsumsi dan kode awal komoditasnya ialah kode 12.","p":"","s":"innas","t":["bl","art"]},{"q":"Alfamidi masuk ke minimarket atau pasar modern?","a":"Minimarket, sesuai dengan penjelasan pada buku pedoman.","p":"","s":"innas","t":[]},{"q":"Mitra 10 masuk outlet atau pasar modern? di Semarang ada Mitra 10 yang tidak hanya menjual alat bangunan tetapi juga alat elektronik dan ada minumannya juga","a":"Tetap masuk ke outlet. Pasar modern yang dicakup di sini umumnya yang menjual barang kebutuhan sehari-hari.","p":"","s":"innas","t":[]},{"q":"Poin/cashback dari transaksi sebelumnya yang digunakan untuk transaksi berikutnya, bagaimana pencatatannya?","a":"Pencatatannya sesuai dengan harga yang dibayarkan sebelum menggunakan koin/cashback tersebut. Kemudian untuk cashback akan dicatat di kuesioner S sebagai balancingnya.","p":"","s":"innas","t":["s"]},{"q":"Terkait contoh Lifebuoy, tadi kan untuk varian beragam, misalkan 100 ml 500 ml dll. Apakah nanti untuk entry akan dilakukan usulan kualitas untuk semua usulan kualitas sampai varian dan volumenya?","a":"Untuk SPKRT berbeda dengan SHK, dimana untuk pencatatan kualitasnya cukup sampai merk sehingga memang tidak sampai dengan gramasi dari masing-masing produk. Jadi nanti cukup sampai merk saja, misalkan sabun cair Lifebuoy","p":"","s":"innas","t":["art"]},{"q":"Jika masak sendiri bagaimana kode untuk tempat perolehannya?","a":"Untuk masak sendiri, yang dicatat adalah bahan bakunya berdasarkan perolehannya","p":"","s":"innas","t":[]},{"q":"Dalam pengisian HR kolom 6, jika responden memproduksi sendiri atau tidak mengetahui untuk sumber perolehan bahan bagaimana pengisiannya? Karena kan tadi untuk defaultnya adalah pasar tradisional, tetapi karena di Kep. Seribu tidak ada pasar tradisional?","a":"Dapat disesuaikan menjadi outlet, begitupun untuk wilayah-wilayah lain yang di daerahnya tidak terdapat pasar tradisional","p":"","s":"innas","t":["hr"]},{"q":"Bagaimana pencatatan untuk warung di sebelah rumah dan produsen (misalkan langsung dari pabrik atau nelayan)?","a":"Masukkan ke outlet. \nDari kami untuk mempermudah jika bukan pasar tradisional, pasar moder, minimarket, market place maka dimasukkan saja sebagai outlet","p":"","s":"innas","t":[]},{"q":"Makanan yang pemberian apakah memang tidak perlu diperkirakan karena di LK nilai konsumsinya di blok warna abu-abu? Misalkan anak yang menerima MBG\n\nKemudian untuk rokok elektrik apakah tidak dicatat di kuesioner LK ini?","a":"Untuk pemberian dari pemerintah seperti MBG memang tidak perlu dicatat, seperti tadi BPJS yang dari pemerintah dan BOS. Namun, untuk kasus pemberian konsumsi dari orang lain tetap diperkirakan nilainya nantinya dicatat di kolom 24, yang tidak perlu diperkirakan adalah rincian per harinya\n\nUntuk rokok elektrik dicatat di BL bukan LK, akan dicatat di kelompok 11 termasuk alat dan cairannya","p":"","s":"innas","t":["bl","hr","adm"]},{"q":"Penegasan untuk yang dimasak dan dikonsumsi, seperti makanan2 yang distok selama seminggu untuk dikonsumsi hariannya terbagi per hari, cukup dipanaskan setiap akan penyajian. Bagaimana perlakuan pencatatannya?","a":"Pencatatan konsumsi untuk masakan frozen yang dimasak sendiri, pengeluarannya dicatat bahan baku masakan pada pembuatan masakan untuk dibekukan tersebut","p":"","s":"innas","t":["bl","hr"]},{"q":"Bagaimana pencatatan untuk pembelian dari GPM (Gerakan Pangan Murah) yang mana harganya lebih murah? Bagaiamana juga untuk jenis pasarnya misalkan di kelurahan, apakah masuk pasar tradisional atau outlet?\n\nBagaimana pencatatan untuk ruta yang membayar tukang salah satunya dengan makan yang tidak bisa dipisahkan, dimana responden mencatatnya sebagai 1 kesatuan konsumsi ruta tidak bisa dipisahkan (sudah diprobing)?","a":"Pengeluaran rumah tangga melalui GPM dicatat, untuk jenis pasarnya misalkan bukan di pasar maka dituliskan saja outlet.\n\nIdealnya seharusnya dipisahkan ya mbak sebenarnya, tetapi karena sulit dipisahkan maka ditulis saja di LK nya. Kemudian dapat ditambahkan di catatan di HR nya. Meskipun nantinya akan tetap dientry seluruhnya","p":"","s":"innas","t":["bl","hr"]},{"q":"Bagaimana pencatatan untuk bumbu dapur yang pengunaannya sedikit-sedikit saja, seperti garam, lada penyedap?\nBagaimana cara menjelaskannya?\nDan juga untuk misalkan komoditas yang digunakan secara berulang seperti minyak goreng?\nKemudian juga untuk pemberian nantinya kan harus ada huruf P, ini oleh responden atau pencacah?","a":"Dalam melakukan penjelasan, perlu ditekankan berkali-kali bahwa yang dicatat harus yang benar-benar digunakan, misalkan ya garam berapa sendok teh atau makan. Kemudian, untuk minyak yang memang digunakan berkali-kali yang dicatat adalah yang pertama kali digunakan. Inilah pentingnya untuk disampaikan ke Inda, dan juga Inda ke petugas agar konsepnya tertanam jelas.\n\nPemberian huruf P dilakukan oleh responden, maka pencacah harus menjelaskan dengan jelas","p":"","s":"innas","t":["bl"]},{"q":"Menu paket apakah pencatatannya harus dipisahkan? Misalkan nasi ayam atau burger ayam, kentang ayam?","a":"Untuk pencatatan nasi ayam sudah ada komoditasnya.\n\nPada paket burger kentang, ayam kentang, dsb diusahakan untuk dipisahkan dan dibuat masing-masing konsumsi","p":"","s":"innas","t":["bl"]},{"q":"Mohon penegasan juga untuk pembelian paket makanan yang bundling dengan minuman, serta paket makanan yang dapat free minuman bagaimana pencatatannya, apakah ada perbedaan","a":"Pembelian barang \"buy 1 get 1\", penentuan nilai konsumsi totalnya dihitung berdasarkan uang riil yang dibayarkan.\n\n- untuk barang hadiah/bonus, hadiah/bonusnya ttp perlu di perkirakan/imputasi.","p":"","s":"innas","t":["bl"]},{"q":"Nelayan perikanan tangkap, apakah dianggap bekerja dengan sarana angkutan karena dia melaut menggunakan kapal?\n\nAnak sekolah yang menyeberang menggunakan kapal saat berangkat. Apakah dihitung sebagai sarana angkutan?","a":"Yang dianggap sarana angkutan adalah dalam perjalanan dari rumah menuju ke pelabuhan atau laut. Jadi kapal melaut bukan dianggap sebagai sarana angkutan\n\nDihitung sebagai sarana transportasi, yang dicatat yang paling panjang jaraknya","p":"","s":"innas","t":[]},{"q":"1. Bagaimana untuk kasus rumah yang awalnya sewa, tetapi lama kelamaan menjadi hak milik atau financial leasing? Apakah dicatat untuk beli atau sewa? \n\n2. Kemudian bagaimana untuk pembelian motor yang digunakan untuk GOJEK/GRAB, apakah masuk ke pembelian alat untuk usaha?","a":"1. Untuk kasus sewa beli rumah akan dihold untuk didiskusikan\n\n2. Untuk sewa beli kendaraan yang digunakan untuk GOJEK/GRAB akan masuk ke pembelian barang atau bahan baku untuk usaha. Pada usaha GOJEK/GRAB dengan kendaraan leasing, maka pendapatan bersih adalah pendapatan dikurangi biaya untuk pembayaran leasing","p":"","s":"innas","t":["s","adm"]},{"q":"Pendapatan rumah tangga terkait usaha yang dicatat adalah pendapatan bersih ya, Mbak? Namun, di pengeluaran ada terkait pengeluaran untuk usaha. Apakah ini tidak terkesan double, jadi tidak sebaiknya tidak perlu dicatat?","a":"Untuk di blok 7, lebih kepada kontrol untuk melihat apakah ada pengeluaran yang terlewat. Jadi mungkin belum bisa kita sampaikan sebagai diskrepansi untuk blok 7.\nJika ada info lebih lanjut akan disampaikan nantinya","p":"","s":"innas","t":["bl","s"]},{"q":"1. Bagaimana jika pada pendataan S ini dilakukan di minggu pertama. Jika belum gajian/menerima pendapatan usaha apakah perlu diperkirakan untuk pendapatan sebulannya?\n2. Untuk kasus pemberian dari rumah tangga lain, apakah nanti akan dimasukkan dalam penghitungan tertentu sebagai penyeimbangnya?\n3. Terkait klaim asuransi, kenapa tempatnya dipisahkan di blok berbeda antara asuransi kecelakaan dan asuransi jiwa?\n4. Ketika menggadaikan sesuatu, artinya dapat uangnya. Apakah barang yang kita gadaikan itu juga perlu dikeluarkan dari barang yang dikuasai?","a":"1. Tetap perlu diperkirakan gaji atau pendapatan dari usaha untuk satu bulan tersebut\n2. Pemberian dari pihak lain dimasukkan ke dalam pengeluaran konsumsi dengan nilai diperkirakan sesuai nilai di pasaran (05 untuk makanan dan 06 untuk bukan makanan)\n3. Dipisahkan karena adanya peruntukan yang berbeda. Di rincian 08 untuk misalkan klaimnya hangus.\nSedangkan rincian 06 jika adanya unsur investasi\n4. Menggadaikan barang pendapatannya dimasukkan ke dalam rincian sublok 8.4 rincian 05 menggadaikan barang. Barang yang digadai tidak dicatat sebagai pengeluaran, tetapi hanya uang hasil gadai yang dicatat di pendapatan","p":"","s":"innas","t":["bl","s"]},{"q":"1. Tunjangan kesehatan yang diperoleh pegawai. Untuk PNS mendapat BPJS, apakah biaya saat sakit/berobat dicatat di BL sebagai penerimaan tunjangan kesehatan?\n2. Pegawai swasta yang mendapat asuransi (bukan BPJS), untuk anak istrinya yang mendapat klaim asuransi akan masuk di Blok 8.1 kolom 5?\n3. Bagaimana pencatatan untuk konsumsi pemberian orang lain. Dimana untuk pencatatan di kuesioner S adalah untuk 3 bulan, padahal yang diperoleh adalah record untuk 7 hari?\n4. Yang sewa lahan itu maksudnya yang sewa lahan, misalkan dia punya lahan pertanian, kemudian disewakan ke orang lain. Nah, kalau untuk yang punya kos kosan, masuknya di\npendapatan usaha lainnya?","a":"1. Klaim BPJS, baik PBI non PBI, tidak dicatat dalam pengeluaran karena merupakan konsumsi pemerintah\n2. Klaim asuransi untuk anak istri akan tetap sama dengan suami, yaitu masuk di Blok 8.1 kolom 5. Kemudian untuk Blok 8.3 adalah untuk asuransi mandiri\n3. Perkiraan hasil pemberian di blok pendapatan tetap disesuaikan dengan yang dicatat di pengeluaran, baik Itu di BL maupun HR\n4. Rincian 8.3 rincian 01 khusus untuk memiliki lahan yang memang disewakan. Untuk penyewaan kos masuk rincian 8.2 rincian 02","p":"","s":"innas","t":["bl","hr","s"]},{"q":"Terdapat perbedaan terkait klaim asuransi kesehatan yang dicatat, kemarin untuk yang non PBI dicatat? \nBerarti untuk klaim BPJS PBI dan non PBI tidak perlu dicatat di BL dan S?","a":"Terdapat perbedaan terkait klaim asuransi kesehatan yang dicatat, kemarin untuk yang non PBI dicatat? \nBerarti untuk klaim BPJS PBI dan non PBI tidak perlu dicatat di BL dan S?","p":"","s":"innas","t":["bl","s"]},{"q":"1. Klaim BPJS yang tidak dicatat sebagai pengeluaran apakah tidak berdampak pada penurunan NK? \nBagaimana jika ada kasus klaim BPJS yang tidak seluruhnya dicoover, apakah yang dicatat sebesar yang dibayarkan saja?\n\n2. Penerimaan Bansos berupa barang konsumsinya tidak dicatat di BL apakah benar? Untuk penerimaan bantuan berupa uang, apakah dicatat di pendapatan lainnya?\nJika tidak dicatat bagaimana untuk konsumsi yang menggunakan uang tersebut?","a":"1. Memang terdapat resiko penurunan NK kesehatan, tetapi juga merujuk ke konsep neraca dimana masuk ke dalam konsumsi pemerintah.\nUntuk biaya yang tidak tercover BPJS akan dicatat sebagai konsumsi rumah tangga sebesar biaya yang dikeluarkan\n\n2. Sementara ini tidak dicatat karena merupakan pemberian dari pemerintah untuk uang dan barang.\nJika memang tidak dapat teridentifikasi maka dapat dilepaskan saja untuk pencatatan konsumsinya meskipun dari uang bantuan pemerintah. Akan didiskusikan lebih lanjut","p":"","s":"innas","t":["sampel","bl","s"]},{"q":"1. Untuk kasus KRT yang tinggal di luar kota, berarti nantinya perlu imputasi juga misalkan berarti untuk rumah yang ditempati ART dan juga ada untuk KRT yang kos?\n \n2. Kemudian untuk KRT yang bekerja di luar kota dan menempati rumah dinas yang ditempati beberapa orang apakah diimputasi?\n\n3. Untuk kendaraan dinas dan laptop yang diperoleh dari kantor, apakah juga diperkirakan untuk sewanya?","a":"1. Betul, nantinya akan ada pencatatan rumah untuk imputasi yang rumah ditempati ART dan juga KRT yang kos\n\n2. Jika hanya menempati kamar tertentu maka perlu diproporsikan atau diperkirakan nilai untuk ruang yang dikuasai saja. Sedangkan jika memiliki akses untuk keseluruhan rumah maka imputasi yang dicatat adalah keseluruhan rumah.\n\n3. Diperkirakan nilai untuk sewanya bukan harga laptopnya","p":"","s":"innas","t":["art"]},{"q":"Untuk bisa mengisi kode jenis barang atau jasa pada BL, apakah jenis barang dan jasa harus selengkap hingga ke merk? Jika iya, kenapa tidadi kuesioner nya sampa merek seperti HR?","a":"Data yang disediakan di Master hanya sampai merek besarnya, tetapi memang diharapkan dari rumah tangga tetap menuliskan secara rinci karena untuk memudahkan dalam pencarian kodenya di masternya nanti.\nUntuk struktur dari Dokumen BL menjadi masukan bagi kami apakah bisa disesuaikan supaya dipisahkan antara nama, barang, dan nama kualitasnya seperti pada pencatatan di HR.","p":"","s":"innas","t":["bl","hr"]},{"q":"1. Biasanya responden bingung mengisikan kalau menggunakan gula, susu bubuk dll karena hanya 1 sendok yang di gunakan. jadi seringnya kosong tidak diisi pleh responden, solusinya bagaimana ? usul kalau bisa di sediakan 1 kolom atau 1 halaman lagi di HR untuk mencatat kualitas dan harga dalam satuan yg biasa dibeli oleh responden untuk memudahkan perkiraan nilai konsumsinya\n2. Terkait kode yang makan banyak yang ambigu seperti bawang merah besar kecil sedang dll, kadang jadi polemik karena bingung kodenya yang mana \n3. Mengenai kuesioner KK, PML Mengisi kuesioner KK Apakah menanyakan ke pasar setempat? mengenai harga dengan satuan setempat. Kemudian menimbangnya untuk mengisi konversi. Apakah cukup sampai situ?","a":"1. Terkait pencatatan HR, memang benar dengan metode dan konsep yang digunakan sekarang cukup menyulitkan yang menyebabkan banyak nilai kosong. Usulan untuk menyediakan 1 lembar untuk pencatatan kualitas dan harga untuk masing-masing responden akan dipertimbangkan. \nUntuk nilai yang kosong misalkan untuk kode P, maka menjadi PR untuk pengawas dalam memperkirakan nilainya. Kemudian, untuk manfaat kuesioner KK adalah memperkirakan seperti kasus susu buku yang per hari dikonsumsi sekian untuk memperkirakan nilainya berdasarkan harga pembeliannya\n2. Untuk pengkodean memang terdapat kesulitan dalam identifkasi untuk memisahkan kualitas-kualitas yang unik. Dalam pengkodean ini dapat disesuaikan saja berdasarkan justifikasi pengawas saja karena nanti dalam penyusunan diagram timbang akan kami evaluasi kembali saat proses penghitungannya\nUntuk penentuan kualitas misalkan bawang besar kecil, dapat dipilih disesuaikan dengan pencacahan SHK di provinsi masing-masing\n3. Mekanisme untuk KK, pengawas mendatangi pasar untuk menanyakan harga untuk kualitas yang belum dapat ditentukan oleh rumah tangga dan memperkirakan nilai konversinya.\nKolom 3 untuk menanyakan harga dalam satuan setempat. Kolom 5 (tidak ditanyakan) merupakan hasil pembagian dari kolom 3 dibagi kolom 4 (hasil menimbang)","p":"","s":"innas","t":["bl","hr"]},{"q":"Terkait keberadaan pasar tradisional, Bagaimana jika terdapat pulau yang tidak memiliki pasar tradisional (untuk barang-barang yang tidak dari pembelian)? Apakah mengikuti kondisi di wilayah kabupaten/kotanya?","a":"Untuk kondisinya sementara mengikuti keadaan di kabupaten/kota","p":"","s":"innas","t":[]},{"q":"Apakah ada terkait rule validasi atau mekanisme pendataan untuk mengecek konsistensi/pengecekan? Misalkan ada bayi di ART harus ada pengeluaran terkait dengan bayi, kemudian juga untuk pengecekan agar memastikan NK tidak under","a":"Rule Validasi sedang masih dalam proses persiapan karena memang juga diperlukan untuk kontrol.\nNanti akan kami dokumentasikan untuk rule validasinya dan mungkin akan dishare sebagai panduan Juga Guidance untuk daerah terkait apa saja sih yang harus diperhatikan saat pencecahannya dan entri nanti.\n\nRencananya juga kami ada menyediakan semacam dashboard sehingga nanti daerah bisa memonitoring untuk nilai konsumsinya dan bisa jadi panduan juga untuk daerah terkait komoditas-komoditas yang harus dipantau, harapannya agar nilai konsumsinya tidak terlalu rendah.","p":"","s":"innas","t":["bl","app","art"]},{"q":"Dokumen S digunakan untuk mencatat komoditas yang Belum didata di BL bulan pertama dan kedua. Bagaimana perlakuannya jika komoditas itu sudah didata di BL1 dan 2, tetapi nilainya under gitu. Misalkan pengeluaran untuk Internet di BL 1 dan 2 itu baru dicatat yang pengeluaran ibu bapaknya. Namun, baru ketahuan kalau misalkan ada anaknya juga di situ yang juga mengkonsumsi internet. Bagaimana perlakuan di dokumen S nya. Apakah kita langsung perbaiki di dokumen S dengan nilai yang sudah ditambahkan dengan nilai pengeluaran anaknya atau bagaimana?","a":"Pencatatan yang dilakukan di S adalah nilai kurangnya, atau yang belum tercatat di BL 1 dan BL 2","p":"","s":"innas","t":["bl"]},{"q":"Apakah untuk sampel SPKRT ini juga mencakup sampel SPDT NTP?","a":"Sampel SPKRT adalah ruta non pertanian","p":"","s":"innas","t":["sampel","art"]},{"q":"1) khusus Tw 1, updating dilakukan pada 30 ruta yg disediakan. apakah 9 stratifikasi rumah tangga itu harus terwakili dalam satu sls? jika setelah pengeceakan ada stratifikasi yg tidak terwakili bagaimana solusinya?\n2) kemudian, untuk SLS jika kabupaten mendapatkan sampel SLS daerah sulit bagaimana mekanisme pengajuan sampelnya?","a":"1) \n2) 1 minggu sebelum pengiriman DSSLS final akan dikirimkan sampel SLS dalam bentuk excel untuk dilakukan identifikasi","p":"","s":"innas","t":["sampel"]},{"q":"Jika pada awalnya ruta tsb eligible, tetapi di tengah triwulan jumlah ART berubah menjadi satu orang atau tidak ada lagi ART yang bekerja/berusaha ataupun pindah rumah, apakah sampel tetap dilanjutkan atau harus diganti?","a":"Lanjut. Pertimbangan penggantian sampel adalah berdasarkan kolom 11 - kolom 14 DSRT","p":"","s":"innas","t":["sampel","art"]},{"q":"ada slide judulnya penambahan keluarga baru, apakah yang ditambahkan dlm pemutakhiran itu keluarga baru? bukan rumah tangga baru? \nmisal:\n1. ada 2 KK baru tapi 1 pengelolaan makanan, apakah cukup ditambah 1 ruta, atau dicatat 2 keluarga dgn yg 1 keluarganya itu dicatat jumlah pmm 0?\n2. ada 1 KK baru tapi pengelolaan makanan terpisah, apakah ditambah 2 ruta, atau 1 keluarga dgn jml pmm 2 dan 1 lagi yg terpisah itu dgn jml pmm 1","a":"Keluarga baru. Pada SPKRT, rumah tangga masuk ke dalam roster. Sehingga ketika keluarga memiliki 2 PMM, maka dalam assignment keluarga tersebut akan mengisikan 2 roster rumah tangga.\n1. tambah 2 kk baru, kk pertama 1 pmm, kk kedua 0 pmm\n2. tambah 1 kk baru dengan 2 pmm","p":"","s":"innas","t":["art"]},{"q":"Jika dalam 1 KK ada Anggota Keluarga yg sudah memenuhi konsep keluarga berdasarkan UU, maka sudah dianggap 1 keluarga sendiri kan ya? \nmisal keluarga A dan keluarga B (baru) yang pengelolaan makan-minumnya terpisah\nKetika mengunjungi keluarga A/B maka jumlah pengelolaan makan-minumnya masing-masing 1?","a":"ya","p":"","s":"innas","t":[]},{"q":"Jika ada sampel yg awalnya ada 1 anggota ruta yg bekerja tapi di bulan kedua atau ketiga pencacahan mengalami PHK sehingga tidak ada lagi yang bekerja, apakah responden tsb lanjut cacah atau harus ganti sampel?","a":"Lanjut. Pertimbangan penggantian sampel adalah berdasarkan kolom 11 - kolom 14 DSRT","p":"","s":"innas","t":["sampel"]},{"q":"Satu bangunan ada 2 keluarga (2 KK), 2 keluarga tadi masing2 ada ART yang bekerja. Untuk makan minum, sistemnya keluarga A membeli beras bulanan, sedangkan keluarga B membeli bahan lauk pauk (sayur, ikan, telur, daging, dll). Untuk proses memasak, kedua keluarga bebas untuk memasak bahan2 tadi. Pengeluaran tagihan air, listrik, wifi, sewa rumah ditanggung bersama-sama. Dianggap 1 rumah tangga atau 2 rumah tangga?","a":"diputuskan atau ditunjuk siapa yang jadi kepala Rutanya","p":"","s":"innas","t":["bl","art"]},{"q":"1. Bagaimana perlakuan untuk remote area (misalnya kabupaten wilayah kepulauan), apabila di kabupaten tersebut tidak bisa memenuhi keterwakilan sampel dalam hal tingkat pendidikan kepala keluarga/KRT? dimana biasanya KK/KRT yang pendidikan tinggi jumlah nya terbatas, dan ada kemungkinan non-respon juga.\n\n2. Setiap sampel utama disediakan dua sampel pengganti, apabila dua sampel pengganti tersebut tidak bisa dilakukan pencacahan, apakah bisa meminta sampel pengganti tambahan ke BPS Pusat?","a":"1. Tim metodologi akan mengirimkan sampel SLS dalam bentuk excel untuk dilakukan identifikasi sebelum lapangan.\n2. Jika sudah tidak ada golongan yang sama, maka cari keluarga/ruta dengan tingkat pendidikan kk/krt yg sama. Jika sudah tidak ada, cari yg jumlah ak/art nya sama","p":"","s":"innas","t":["sampel","art"]},{"q":"Terkait pemutakhiran, untuk 1 ruta yang terdiri atas beberapa keluarga, dan tinggal di SLS berbeda\n1. Keluarga KRT (induk) tinggal di SLS Sampel, sementara Keluarga lain di luar SLS sampel.\n2. Keluarga KRT (induk) tinggal di luar SLS Sampel, sementara Keluarga Lain di SLS sampel.\n\nUntuk poin 2, nomor urut rumah tangga pada keluarga Lain diisi berapa?","a":"Jika keluarga induk berada di luar SLS sampel, maka dianggap sebagai ruta sendiri dengan no urut melanjutkan nurut ruta terbesar","p":"","s":"innas","t":["sampel","art"]},{"q":"Bagaimana penentuan rumah tangga yg didata di M1 M2 M3 M4 untuk VPKRT-HR? Apakah dibebaskan saja ke petugas? Izin pak/bu, maksud saya untuk menentukan 2 ruta di M1, 3 ruta di M2 dst nya itu bagaimana? siapa yg M1 siapa yg M2 dst","a":"Rumah tangga yg dicacah HR sesuai dengan sampel rumah tangga terpilih","p":"","s":"innas","t":["sampel","hr","art"]},{"q":"Berapa jumlah sampel per PCL?","a":"10 rumah tangga per triwulan","p":"","s":"inda","t":["sampel"]},{"q":"Apakah ada semacam kalender yg memuat seluruh jadwal dalam pendataan SPKRT 2027 untuk memudahkan PPL/PML mengingat jadwal kunjungan ke responden? Seingat saya dulu saat SBH2018 ada, mungkin yg sekarang ada juga?","a":"Iya akan ada. Masih proses di pusat","p":"","s":"inda","t":["jadwal","art"]},{"q":"Apabila sangat diperlukan penggantian sampel di tengah-tengah triwulan, apakah secara mekanisme memungkinkan? Misal karena responden sudah tidak berkenan lagi, pindah, atau karena rangkaian kedukaan sehingga sangat sulit ditemui?","a":"Mungkin, tiap bulan","p":"","s":"inda","t":["sampel"]},{"q":"Sampel yang pindah keluar SLS apakah otomatis harus diganti?","a":"Iya, dicek tiap bulan. Kalau masih bisa ditelusuri, tetap diganti. Batasannya SLS","p":"","s":"inda","t":["sampel"]},{"q":"Syarat eligible ruta terpilih (ada ART bekerja) apakah harus terpenuhi sepanjang bulan? Jika pada bulan-bulan tertentu tidak ada ART yang bekerja, apakah harus diganti sampel?","a":"Lanjut, tidak ganti sampel. Pertimbangan penggantian sampel adalah berdasarkan kolom 11 - kolom 14 DSRT (tidak dapat ditemui, menolak, pindah)","p":"","s":"inda","t":["sampel","art"]},{"q":"Jika golongan sampel pengganti sudah tidak ada yang sesuai dengan golongan utama, apakah artinya akan ada Non Respon? atau bisa diganti dari golongan sampel yang berbeda?","a":"diganti dgn golongan berbeda, sesuai prosedur penggantian sampel. cari dulu yang sama pendidikannya, kalau masih ga ada, cari yg sama jumlah art nya","p":"","s":"inda","t":["sampel","art"]},{"q":"Apabila pada saat pertengahan pendataan ada ART yang menikah (misal anaknya) dan membentuk rumah tangga baru, bagaimana pencatatannya?","a":"diupdate di BL bulan berikutnya. misal 1 Januari pas BL 1 masih ada anaknya berarti konsumsinya masih konsumsi sama anaknya trus 1 Februari pas BL 2 udah menikah anaknya dan lepas dari ruta tsb berarti diupdate nama-namanya di blok IV (tanpa si anak) dan konsumsinya jg tanpa si anak di BL 2 nya","p":"","s":"inda","t":["bl","art"]},{"q":"Kasus Junaidi dan Parulian pada bahan ajar keduanya ada di prelist. Bagaimana jika hanya keluarga Parulian saja yang ada di prelist (tw 1)? Apakah PMM 0 atau 1?","a":"PMM 0 kalau dalam 1 SLS. PMM 1 kalau di luar SLS","p":"","s":"inda","t":["sampel"]},{"q":"Batasan kode tidak dapat ditemui sampai akhir pendataan itu di tanggal berapa? karena harus diganti untuk pendataan pada bulan itu kan ya","a":"\"belajar dari pengalamn SBH sebelumnya..masa tunggu itu hanya 1 bulan,ketika tidak kita dapatkan informasi terkait keberadaan ruta sampel,dan dari sisi tetangga serta ketua RT juga tidak mempunyai infomasi hal tsb, PPL langsung koordinasi dengan PML untuk pergantian sampel..tetapi jika ada informasi keberaaan ruta,dan memang pindah misalkan,maka seera dicarikan sampel penggantinya\"","p":"","s":"inda","t":["sampel"]},{"q":"untuk Tw2 s.d Tw4 apakah pemutakhirn dilakukan dgn beda SLS tiap triwulannya?apakh hanya beda SLS dlm 1 desa mengingat jika SLSnya beda desa atau bahkan sampai beda kecamatn akan brdampak ke penentuan petugas dgn wlyh kerja berbeda2 tiap twln","a":"iya berbeda. infonya akan ada daftar SLS di akhir bulan ini. kalau belum ada akan dimintakan daftar kecamatannya untuk alokasi petugasnya","p":"","s":"inda","t":["sampel"]},{"q":"Anggota rumah tangga yang pulang 2-3 hari sekali, misal 2 hari menginap di rumah dinas/kost, 2 hari berikutnya tidur di rumah, menyesuaikan keadaan aja gitu pulang-menginapnya, apakah dicatat sebagai ART atau sudah bukan?","a":"Bukan","p":"","s":"inda","t":["art"]},{"q":"Kalau di triwulan 1 dari identifikasi hanya mendapat 9 ruta eligible gimana?","a":"kasus ekstrem. kalau ditemukan, akan didiskusikan dgn ketua tim spkrt (pusat)","p":"","s":"inda","t":["sampel","art"]},{"q":"Kepala rumah tangga pulang sebulan sekali (di slide ada batasan tidak dianggap KRT kalau bepergian lebih dari setahun) berarti dicatat sbg KRT kan? Bagaimana pencatatan konsumsinya? Apakah diestimasi seperti di susenas?\nKalau menunggu pulang untuk recall, bagaimana kalau KRT nya 3 bulan sekali atau ga tentu tapi kurang dari setahun (tidak bisa ditemui pada periode pendataan)?","a":"Iya tetap dicatat sebagai KRT dan diestimasi seperti di susenas","p":"","s":"inda","t":["bl","art"]},{"q":"Di buku pedoman anak boarding dicatat sebagai anggota rumah tangga orang tuanya. Bagaimana pencatatan konsumsi si anak boarding tsb?","a":"jika ada informasi terkait pengeluaran selama di pondok berapa bisa diestimasi oleh Ibu atau ruta sampel tersebut..jika tidak,cukup dipilih komoditas biaya sekolah boarding school berikut makan dan minum ,biaya tanpa makan dan minum","p":"","s":"inda","t":["sampel","bl","art"]},{"q":"Apakah hari mulai HR harus selalu di hari Minggu? Boleh dicontohkan timeline turun HR di bulan Juni, September, Desember?","a":"Kalau tidak bisa ditemui minggu, resikonya harus recall pengisiannya dari hari senin","p":"","s":"inda","t":["hr"]},{"q":"Pengeluaran pribadi asisten rumah tangga berarti tidak dicatat di BL maupun HR kan ya?","a":"iya","p":"","s":"inda","t":["bl","hr"]},{"q":"Bagaimana pencatata pembelian hp secara kredit? harga kontan?","a":"Bulan pembelian:\n- konsumsi: handphone, harga kontan, kode perolehan kredit\n- bukan konsumsi: uang muka, nilai yg dibayarkan, kode perolehan lunas\n\nBulan selanjutnya:\n- bukan konsumsi: cicilan, nilai yg dibayarkan, kode perolehan lunas","p":"","s":"inda","t":["bl"]},{"q":"Kalau arisan barang tapi masih membayar terus dan belum menerima barangnya, berarti pengeluaran arisannya itu tidak dicatat?","a":"Arisan barang pencatatannya seperti kredit.\nKetika blm menerima baang dicatat adalah cicilannya, ketika sudah menerima barang, ditambahkan konsumsi barang tsb dan dibalance penerimaan kredit","p":"","s":"inda","t":["bl"]},{"q":"Kalau anak yang boarding, apakah boleh kalau pengeluaran yang dicatat hanya nilai transfer dari orang tua ke anak saja di BL? Tidak perlu memperkirakan pengeluaran di HRp? Apakah jika diperkirakan pengeluaran pribadi di HRp tidak double count pengeluarannya?","a":"Tidak boleh karna anak tsb dicatat sebagai anggota rumah tangga. Diestimasi HR dan BL nya, kalau tidak bisa cukup catat pengeluaran biaya boarding school nya. Transfer ke anak tidak dicatat sehingga tidak akan double counting","p":"","s":"inda","t":["bl","hr","art"]},{"q":"Bagaimana batasan BTT dan BC? Apakah seperti SE, di mana BC harus memiliki ruangan khusus yang digunakan untuk usaha?","a":"Iya","p":"","s":"inda","t":["s"]},{"q":"Kuesioner S kan hanya merekap dr BL bulan ke 1 dan 2, untuk bulan 3 berarti tidak direkap? Atau direkap di mana ya Kak?","a":"Kuesioner S bukan untuk merekap tetapi mengecek apakah pengeluaran di bulan 1 dan 2 sudah lengkap, kalau ada yg terlewat barulah dicatat di kuesioner S. Karna turun kues S jg di bulan 3 maka bisa sekalian memastikan sudah lengkap pencatatan di BL 3","p":"","s":"inda","t":["bl","s"]},{"q":"Dhidhi mart dan DK mart di Gorontalo Utara masuk ke minimarket atau pasar modern yaa?\n\nDhidi mart yang cukup besar, yang menjual makanan, baju, alat elektronik, alat kebersihan, termasuk ke minimarket atau pasar modern?","a":"Sepertinya pasar modern. Kita buat identifikasi ya di sheet pasar modern","p":"","s":"inda","t":["sampel"]},{"q":"Terkait dengan klaim asuransi. Misal Pak A bekerja di perusahaan. Di BL tercatat biaya premi asuransi 80rb/bulan. Kemudian mengalami kecelakaan dan pengeluarannya direimburse kantor sebanyak 1,2jt. Itu pencatatannya seperti apa? Apakah 80rb dan 1,2jt dicatat di BL sebagai pengeluaran, Kemudian reimburse 1,2jt sebagai pendapatan di Kues S Blok VIII.1 kolom 5 saja? Atau ada juga pencatatan di Blok VIII.3 rincian 8? Kalau ada yang kurang, mohon ditambahkan di mana saja yang perlu diisi","a":"Pencatatan:\n1. Biaya premi: \n- kalo full bayar sendiri: dicatat di BL setiap bulan yg dibayarkan atau di S yg bukan konsumsi\n- kalo dibagi 2 sama kantor: yg dicatat di BL full biaya premi, kemudian dicatat di gaji barang/jasa besaran premi yg dibayar kantor \n2. Biaya RS: \n- dicatat di BL bulan yg bersesuaian atau di S yg konsumsi kelompok kesehatan\n- dicatat di S yg gaji barang/jasa (Blok VIII.1 kolom 5)\n\nTidak perlu dicatat di VIII.3 rincian 8, rincian tsb akan terisi jika asuransi mandiri (bukan asuransi dari kantor)","p":"","s":"inda","t":["bl","s","adm"]},{"q":"Batasan suatu komoditas masuk di Blok VI (konsumsi) yg cara perolehannya 5 (diberikan ke pihak lain) dengan Blok VII.1 (bukan konsumsi) rincian 1211020 (hadiah/pemberian ke pihak lain) itu apa ya kak? Maaf kalau kelewat.","a":"Semua komoditas yg dikode 5 di BL akan dikode 1211020. Berarti di S tidak mungkin ada yg kode 5 di blok VI","p":"","s":"inda","t":["bl","s"]},{"q":"Untuk pertanyaan \"Apakah Bekerja dalam Periode Survei?\", berarti jika seminggu terakhir tidak bekerja karena phk atau menunggu musim (untuk petani), selama dalam periode survei dia pernah bekerja/tanam padi/jagung, tetap kode 1? \n\nKalau untuk pekerja serabutan/bebas (freelance) pada sektor pertanian maupun non pertanian yang sedang menunggu pekerjaan, meskipun sebelumnya (selama periode survei) dia pernah bekerja, apakah kodenya 2? \n\nMaaf soalnya agak rancu dengan referensi waktu survei (1 triwulan) dengan referensi waktu dikatakan bekerja (seminggu)","a":"iya tetap kode 1. \n\nkalo selama periode survei itu pernah bekerja maka kode 1. tapi kalo selama periode survei mereka hanya menunggu pekerjaan maka kode 2.\n\nkalau dalam seminggu terakhir tidak ada kan jadinya tidak bekerja, tapi kalo dalam periode pencacahan dalam seminggu pernah 1 jam kumulatif bekerja berarti pernah bekerja kan. nah tetap kode 1 kalau sementara tidak bekerja tetapi dalam periode pencacahan pernah bekerja","p":"","s":"inda","t":[]},{"q":"Terkait nilai-nilai di blok VIII yang baru akan didapat pada minggu terakhir periode pendataan, katanya kan tetap dimasukkan ya di S, tapi bagaimana pengisiannya? Misal turun di ruta A pada minggu kedua, blok VIII ini kan ditanyakan di hari terakhir di minggu kedua itu, lalu apakah diperkirakan nilainya? Atau bagaimana ya?","a":"iya diperkirakan","p":"","s":"inda","t":["s","jadwal"]},{"q":"Konsumsi MBG, apakah diimputasi di HR HRp?","a":"Tidak, karna masuk ke konsumsi pemerintah","p":"","s":"inda","t":["bl","hr"]}];
const MENUS=[['home','Beranda','🏠',''],['agenda','Agenda','📋','Jadwal dan checklist kegiatan'],['kal','Kalender','📅','Tampilan bulanan'],['mon','Monitoring','📊','Kemajuan per triwulan'],['rt','Rumah Tangga','🏘️','Laporan per rumah tangga'],['hs','Serah Terima','🤝','Alur serah terima dokumen'],['gt','Pergantian','🔄','Lapor pergantian sampel'],['rek','Rekap','👥','Progres petugas'],['qna','QnA','❓','Tanya jawab dan penegasan'],['kode','Kode SPKRT','🔎','Master kode komoditas','https://s.bps.go.id/9201MasterKodeSPKRT2027'],['mat','Materi','📚','Buku pedoman dan penegasan'],['set','Pengaturan','⚙️','Akun, pengingat, cadangan']];
const mVis=k=>!((k==='rek'&&S.role==='PPL')||(k==='rt'&&S.role!=='PPL')||(k==='hs'&&S.role==='PPL'));
const dh=document.createElement('div');dh.className='dh';dh.id='dh';nav.appendChild(dh);
const goM=k=>{const m=MENUS.find(x=>x[0]===k);if(m&&m[4]){window.open(m[4],'_blank','noopener');return}view=k;render();window.scrollTo(0,0)};
MENUS.forEach(([k,l,_i,,u])=>{const b=document.createElement('button');b.innerHTML=ic(k)+'<span>'+l+'</span>'+(u?'<span style="opacity:.5;font-size:12px;margin-left:auto">↗</span>':'');b.dataset.k=k;b.onclick=()=>{closeNav();goM(k)};nav.appendChild(b)});
{const o=document.createElement('button');o.className='out';o.innerHTML=ic('out')+'<span>Keluar</span>';o.onclick=()=>{closeNav();logout()};nav.appendChild(o)}
window.addEventListener('popstate',()=>{window.hp=0;closeNav();if(S.cur&&view!=='home'){view='home';render();window.scrollTo(0,0)}});
function toggleNav(){nav.classList.toggle('open');document.getElementById('ov').classList.toggle('on')}
function closeNav(){nav.classList.remove('open');document.getElementById('ov').classList.remove('on')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}
function evCard(e,open){
 const st=status(e),p=Math.round(prog(e)*100);
 const chk=S.chk[K(e.id)]||[],DT=dets(e),info=e.type==='TIM'?e.det:(e.type==='PERS'?[]:S.role!=='PPL'?e.det.filter(d=>!isPml(d)):[]);
 return `<div class="card ev ${e.type} ${isDone(e)?'done':''}" id="e${e.id}">
 <div class="row"><span class="pill ${e.type}">${BL_N[e.type]}${e.tw?' · TW '+e.tw:''}</span><span class="sp"></span><span class="tag ${st.k}">${st.t}</span></div>
 <h3>${e.title}</h3>
 <div class="date">📅 ${fmtD(e)} ${e.sd.getFullYear()===2027||e.sd.getFullYear()===2028?'':''}${diff(e.ed,e.sd)===0?'('+HARI[e.sd.getDay()]+')':''}</div>
 ${e.flag?`<div class="flag">⚠ ${e.flag}</div>`:''}
 ${DT.length?`<details ${open?'open':''}><summary>Checklist ${S.role} (${chk.filter(Boolean).length}/${DT.length})</summary><ul class="chk">${DT.map((d,i)=>`<li><input type="checkbox" ${chk[i]?'checked':''} onchange="tick(${e.id},${i},this.checked)"><span>${d}</span></li>`).join('')}</ul></details>`:''}
 ${info.length?`<details><summary class="lbl">${e.type==='TIM'?'Keterangan':S.role!=='PPL'?'Tugas PPL yang Anda awasi':'Isi kegiatan'} (${info.length})</summary><ul class="chk">${info.map(d=>`<li><span>• ${d}</span></li>`).join('')}</ul></details>`:''}
 ${S.role!=='PPL'&&!DT.length&&e.type!=='PERS'&&e.type!=='TIM'?`<div class="lbl" style="margin-top:4px">Kalender tidak memuat tugas khusus PML di kegiatan ini; PML mendampingi dan memeriksa hasil PPL.</div>`:''}
 <div class="row" style="margin-top:8px"><button class="b s ${isDone(e)?'':'p'}" onclick="toggleDone(${e.id})">${isDone(e)?'Batalkan selesai':'Tandai selesai'}</button><button class="b s" onclick="noteEdit(${e.id})">📝 Catatan${S.note[K(e.id)]?' •':''}</button><span class="sp"></span><span class="lbl">${p}%</span></div>
 ${S.note[K(e.id)]?`<div class="lbl" style="margin-top:6px">Catatan: ${esc(S.note[K(e.id)])}</div>`:''}
 </div>`}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function tick(id,i,v){const k=K(id),a=S.chk[k]||(S.chk[k]=[]);a[i]=v;const e=EV.find(x=>x.id===id),n=dets(e).length;if(v&&n&&a.filter(Boolean).length===n&&!S.done[k]){S.done[k]=1;toast('Semua checklist selesai – kegiatan ditandai selesai')}save();keepOpen(id)}
function openAg(id){view='agenda';openId=id;render();const el=document.getElementById('e'+id);if(el)el.scrollIntoView({block:'start'})}
function toggleDone(id){const k=K(id);if(S.done[k])delete S.done[k];else S.done[k]=1;save();keepOpen(id)}
let openId=null;
function keepOpen(id){openId=id;render();const el=document.getElementById('e'+id);if(el)el.scrollIntoView({block:'center'})}
function noteEdit(id){const e=EV.find(x=>x.id===id);modal(`<h3 style="margin-top:0">Catatan – ${e.title}</h3><textarea id="nt">${esc(S.note[K(id)]||'')}</textarea><div class="row" style="margin-top:8px"><span class="sp"></span><button class="b" onclick="closeM()">Batal</button><button class="b p" onclick="saveNote(${id})">Simpan</button></div>`)}
function saveNote(id){const v=document.getElementById('nt').value.trim(),k=K(id);if(v)S.note[k]=v;else delete S.note[k];save();closeM();render()}
function modal(h){document.getElementById('mbody').innerHTML=h;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function home(){
 if(!S.role)return `<div class="card"><b>Selamat datang</b><div class="lbl" style="margin:4px 0 10px">Pilih peran Anda (PPL, PML, atau Admin) agar jadwal dan checklist sesuai tugas.</div><button class="b p" onclick="roleM()">Pilih peran</button></div>`;
 const t=today(),act=EV.filter(e=>!isDone(e));
 const late=act.filter(e=>diff(e.ed,t)<0);
 const now=act.filter(e=>diff(e.sd,t)<=0&&diff(e.ed,t)>=0);
 const soon=act.filter(e=>{const d=diff(e.sd,t);return d>0&&d<=Math.max(S.lead,7)});
 const nxt=act.filter(e=>diff(e.sd,t)>0)[0];
  const tot=EV.length,dn=EV.filter(isDone).length,pc=Math.round(dn/tot*100);
  let h=`<div class="card prg"><div class="row"><b>Progres SPKRT</b><span class="sp"></span><span class="lbl">${dn}/${tot} kegiatan · ${pc}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${dn/tot*100}%"></i></div></div>`;
  const pick=[...now,...late.slice().reverse(),...soon];if(nxt&&!pick.includes(nxt))pick.push(nxt);
  const show=pick.slice(0,3);
  h+=`<div class="sec"><b>Agenda terdekat</b>${late.length?`<span class="tag late" style="margin-left:8px">${late.length} terlambat</span>`:''}<span class="sp"></span><a href="#" onclick="view='agenda';render();return false">Semua agenda ›</a></div>`;
  h+=show.length?show.map(e=>{const s=status(e),d=diff(e.sd,t);const tt=s.k==='late'?s.t:(now.includes(e)?'Berlangsung':d>0?d+' hari lagi':s.t);return `<div class="agm ${e.type}" onclick="openAg(${e.id})"><div class="mi"><b>${e.title}</b><span>${fmtD(e)}</span></div><span class="tag ${s.k==='late'?'late':now.includes(e)?'today':'soon'}">${tt}</span><button class="ck" title="Tandai selesai" onclick="event.stopPropagation();toggleDone(${e.id})">✓</button></div>`}).join(''):`<div class="card lbl">Semua kegiatan sudah selesai.</div>`;
  h+=`<div class="menu">${MENUS.filter(m=>m[0]!=='home'&&mVis(m[0])).map(m=>`<button onclick="goM('${m[0]}')"><span class="ic">${ic(m[0])}</span><b>${m[1]}</b><span class="lbl">${m[3]}</span></button>`).join('')}</div>`;
 return h}
function agenda(){
 const list=EV.filter(e=>(!fTW||e.tw===fTW||(fTW==='-'&&!e.tw))&&(!fTY||e.type===fTY)&&(!fSt||(fSt==='done'?isDone(e):!isDone(e)&&(fSt==='all'||(fSt==='late'?status(e).k==='late':true)))));
 let h=`<div class="card row"><select onchange="fTY=this.value;render()"><option value="">Semua jenis</option>${Object.entries(BL_N).map(([k,v])=>`<option value="${k}" ${fTY===k?'selected':''}>${v}</option>`).join('')}</select>

 for(let i=0;i<off;i++)h+='<div class="cell out"></div>';

 return h+'</div><div class="row lbl" style="margin-top:8px"><span class="pill BL">BL</span><span class="pill HR">HR</span><span class="pill PEM">Pemutakhiran</span><span class="pill TIM">Tim</span><span class="pill PERS">Persiapan</span></div>'}

 const pr=EV.filter(e=>e.type==='PERS');let h=`<div class="card"><div class="row"><b>Persiapan 2026 (Nov–Des)</b><span class="sp"></span><span>${pr.filter(isDone).length}/${pr.length}</span></div><div class="bar" style="margin:6px 0"><i style="width:${pr.filter(isDone).length/pr.length*100}%"></i></div><div class="row">${pr.map(e=>`<button class="b s ${isDone(e)?'p':''}" onclick="goEv(${e.id})">${e.title.split(' ').slice(0,2).join(' ')}</button>`).join('')}</div></div>`;h+='<div class="card"><b>Kemajuan per triwulan</b><div class="lbl">Kunjungan BL (6 kunjungan per triwulan; Keenam jatuh di awal triwulan berikutnya)</div></div><div class="tw">';

 h+='</div><div class="card" style="margin-top:14px"><b>Kunjungan HR per periode</b><div class="lbl">Tiap minggu (I–IV) 3 kunjungan. Klik angka untuk membuka kegiatan.</div></div>';
 [[2,'TW I (Feb–Apr 2027)'],[6,'TW II (Jun–Jul 2027)'],[9,'TW III (Sep–Okt 2027)'],[12,'TW IV (Des 2027–Jan 2028)']].forEach(([mm,lab],i)=>{

  const p=rtProg(r,tw),ev=rtEvents(r,tw),g=gFor(r);

  <div>${esc(r.krt)}</div>${r.alamat?`<div class="lbl">${esc(r.alamat)}</div>`:''}

  <details data-id="${r.id}" style="margin-top:6px"><summary>Serah terima dokumen (${hoCount(r.ho,tw,HO_PPL).d}/${hoCount(r.ho,tw,HO_PPL).n})</summary>${hoHtml(r.ho,tw,HO_PPL,'hoTog',r.id)}</details>
  <div class="row" style="margin-top:8px"><button class="b s" onclick="rtForm(${r.id})">Ubah</button>${g?'':`<button class="b s" onclick="gtForm(0,{nks:'${esc(r.nks).replace(/'/g,'')}',no:${r.no},krt:'${esc(r.krt).replace(/'/g,'')}',alamat:'${esc(r.alamat||'').replace(/'/g,'')}'})">Lapor pergantian sampel</button>`}</div></div>`});
 return h}

  document.querySelectorAll('#mbody [data-r]').forEach(b=>b.onclick=()=>{r=b.dataset.r;draw()});
  document.getElementById('rok').onclick=()=>{const x=document.getElementById('rx').value.trim(),w=document.getElementById('rw').value;const nm=x||w.split(' – ')[0].replace(/ \(Inda\)$/,'');if(!nm){toast('Pilih atau ketik nama');return}S.role=r;S.who=nm;save();closeM();view='home';render()}}}
